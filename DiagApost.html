<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagramador de Apostilas</title>
<style id="pgs"></style>
<style>
:root{--bg:#f4f4f2;--pn:#fff;--tx:#222;--mu:#6b6b66;--bd:#d6d6d1;--ac:#2563eb;--ws:#dcdcd8;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1f22;--pn:#2b2d31;--tx:#e6e6e6;--mu:#a0a3a8;--bd:#44474d;--ac:#7aa7ff;--ws:#141517;--in:#1e1f22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1f22;--pn:#2b2d31;--tx:#e6e6e6;--mu:#a0a3a8;--bd:#44474d;--ac:#7aa7ff;--ws:#141517;--in:#1e1f22;color-scheme:dark}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto 1fr;font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
#tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--pn);border-bottom:1px solid var(--bd)}
#tb label{display:flex;align-items:center;gap:3px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:5px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#main{display:grid;grid-template-columns:200px 1fr 270px;min-height:0}
.col{background:var(--pn);overflow:auto;padding:10px;min-height:0}
#L{border-right:1px solid var(--bd)}#R{border-left:1px solid var(--bd)}
h4{margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--mu)}h4:first-child{margin-top:0}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tools button{font-size:17px;padding:6px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}.full{grid-column:1/-1}
label.r{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--mu)}
label.r input,label.r select{width:100%;color:var(--tx);font-size:13px;padding:3px 6px}
input[type=color]{padding:0;height:26px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}.chips button{min-width:30px;padding:3px 7px}
.chips label{display:flex;gap:4px;align-items:center}
.li{padding:3px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li:hover{background:var(--bg)}.li.sel{background:var(--ac);color:#fff}
.mu{color:var(--mu);font-size:11px;margin:6px 0 0}
#st{overflow:auto;background:var(--ws);padding:24px;min-width:0}
.pg{position:relative;background:#fff;margin:0 auto;box-shadow:0 2px 10px #0004}
.o{position:absolute;cursor:move;user-select:none}
.o.mst{opacity:.55!important;pointer-events:none}
.o.sel{outline:1px solid var(--ac)}
.o.ov::after{content:"+";position:absolute;right:-1px;bottom:-15px;background:#d11;color:#fff;font:bold 11px sans-serif;padding:0 5px;border-radius:2px}
.o.line::before{content:"";position:absolute;left:0;right:0;top:-5px;bottom:-5px}
.hd{position:absolute;width:9px;height:9px;margin:-5px 0 0 -5px;background:#fff;border:1px solid #2563eb}
.gd{position:absolute;inset:0;pointer-events:none}.gd i{position:absolute;display:block}
#pr{display:none}
dialog{background:var(--pn);color:var(--tx);border:1px solid var(--bd);border-radius:8px}
@media(max-width:900px){#main{grid-template-columns:150px 1fr 220px}}
@media print{
:root{padding:0}html,body{height:auto}body{display:block}
body>*:not(#pr){display:none!important}#pr{display:block}
.pg{box-shadow:none;margin:0;overflow:hidden;break-after:page}.pg:last-child{break-after:auto}}
</style></head><body>
<div id="tb">
<button onclick="newD()">Novo</button><button onclick="proj()" title="Ctrl+S">Salvar / abrir…</button><button onclick="prt()">Imprimir / PDF</button>
<button onclick="und(-1)" title="Desfazer (Ctrl+Z)">↶</button><button onclick="und(1)" title="Refazer (Ctrl+Y)">↷</button>
<button onclick="zm(-.1)">−</button><span id="zl">100%</span><button onclick="zm(.1)">+</button><button onclick="fit()">Ajustar</button>
<label><input type="checkbox" id="tg" checked onchange="draw()">Guias</label>
<label><input type="checkbox" id="tgd" onchange="draw()">Grade 5 mm</label>
<label><input type="checkbox" id="tsn" checked onchange="draw()">Ímã</label>
</div>
<div id="main">
<div id="L" class="col"><h4>Ferramentas</h4><div class="tools" id="tl"></div>
<h4>Páginas</h4><div class="chips" id="pgl"></div>
<div class="chips" style="margin-top:6px"><button data-pa="add">+ Página</button><button data-pa="dup">Duplicar página</button><button data-pa="del">Excluir página</button></div>
<h4>Objetos da página</h4><div class="chips" style="margin-bottom:6px"><button data-ox="dup">Duplicar objeto</button></div><div id="ly"></div></div>
<div id="st"></div>
<div id="R" class="col"></div>
</div>
<div id="pr"></div>
<dialog id="dl"><form method="dialog" style="display:grid;gap:8px;width:min(520px,86vw)"><b>Projeto</b>
<textarea id="js" rows="10" style="font:11px monospace"></textarea>
<div class="chips"><button type="button" onclick="cp()">Copiar</button><button type="button" onclick="dn()">Baixar .json</button><button type="button" onclick="load($('#js').value)">Carregar do texto</button><button type="button" onclick="$('#fj').click()">Abrir arquivo…</button><button>Fechar</button></div>
<span class="mu">O projeto também é salvo automaticamente neste navegador.</span></form></dialog>
<input type="file" id="fi" accept="image/*" hidden><input type="file" id="fj" accept=".json,application/json" hidden>
<script>
const K=96/25.4,PT=25.4/72,$=s=>document.querySelector(s),rd=v=>Math.round(v*10)/10,esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const SZ={A4:[210,297],A5:[148,210],A3:[297,420],Carta:[216,279],'Ofício':[216,330]};
const FN=['Georgia','Times New Roman','Garamond, Georgia','Arial','Verdana','Trebuchet MS','Tahoma','Courier New','Impact'];
const TL=[['v','↖','Selecionar (V)'],['t','T','Quadro de texto (T)'],['m','▭','Retângulo (M)'],['l','◯','Elipse (L)'],['n','／','Linha (N)'],['i','▣','Imagem (I)']];
const NM={text:'Quadro de texto',rect:'Retângulo',ellipse:'Elipse',line:'Linha',img:'Imagem'},IC={text:'T',rect:'▭',ellipse:'◯',line:'／',img:'▣'};
const HD=[['nw',0,0],['n',50,0],['ne',100,0],['e',100,50],['se',100,100],['s',50,100],['sw',0,100],['w',0,50]];
let doc,cur=0,sel=null,tool='v',zoom=1,H=[],hi=-1,clip=null,uid=1,imgFor=null;
const P=()=>cur<0?doc.master:doc.pages[cur],pg=()=>$('#st .pg');
const mk=(t,e)=>Object.assign({id:uid++,t,x:20,y:20,w:60,h:40,r:0,fill:t=='rect'||t=='ellipse'?'#cfe0ff':'',stroke:t=='line'?'#000000':'#1e3a8a',sw:t=='line'?1:0,op:100,rad:0,text:'Texto',ff:'Georgia',fs:11,lh:1.4,al:'left',col:'#000000',b:0,i:0,u:0,cols:1,gut:4,pad:2,ind:0,ls:0,hy:1,fit:'cover',src:''},e);
function setUid(){uid=Math.max(0,...doc.pages.flatMap(p=>p.o).concat(doc.master.o).map(o=>o.id))+1}
function newD(){doc={w:210,h:297,mt:20,mb:20,ml:20,mr:20,cols:1,gut:5,pages:[{o:[]}],master:{o:[]}};doc.master.o.push(mk('text',{x:20,y:284,w:170,h:6,text:'{pg}',al:'center',fs:9,pad:0}));cur=0;sel=null;H=[];hi=-1;commit();fit()}
function commit(){H=H.slice(0,hi+1);H.push(JSON.stringify(doc));if(H.length>60)H.shift();hi=H.length-1;
 try{localStorage.setItem('apostila',H[hi])}catch(e){try{localStorage.setItem('apostila',JSON.stringify(doc,(k,v)=>k=='src'?'':v))}catch(e2){}}}
function und(d){const j=hi+d;if(j<0||j>=H.length)return;hi=j;doc=JSON.parse(H[j]);if(cur>=doc.pages.length)cur=doc.pages.length-1;sel=null;ui()}
function ui(){draw();panel();side()}
function place(e,o,s){const h=o.t=='line'?Math.max(o.sw*PT*s,1):o.h*s;Object.assign(e.style,{left:o.x*s+'px',top:o.y*s+'px',width:o.w*s+'px',height:h+'px',transform:o.r?`rotate(${o.r}deg)`:''})}
function oel(o,s,n){
 const e=document.createElement('div'),z=e.style;e.className='o '+o.t;e.dataset.id=o.id;place(e,o,s);z.opacity=o.op/100;z.boxSizing='border-box';
 if(o.t=='line')z.background=o.stroke||'#000';
 else{if(o.fill)z.background=o.fill;if(o.sw&&o.stroke)z.border=o.sw*PT*s+'px solid '+o.stroke;z.borderRadius=o.t=='ellipse'?'50%':o.rad*s+'px'}
 if(o.t=='text'){const t=document.createElement('div');t.lang='pt-BR';
  Object.assign(t.style,{width:'100%',height:'100%',overflow:'hidden',padding:o.pad*s+'px',whiteSpace:'pre-wrap',fontFamily:o.ff,fontSize:o.fs*PT*s+'px',lineHeight:o.lh,textAlign:o.al,color:o.col,fontWeight:o.b?'bold':'normal',fontStyle:o.i?'italic':'normal',textDecoration:o.u?'underline':'none',columnCount:o.cols,columnGap:o.gut*s+'px',columnFill:'auto',textIndent:o.ind*s+'px',letterSpacing:o.ls*PT*s+'px',hyphens:o.hy?'auto':'manual',boxSizing:'border-box'});
  t.textContent=o.text.replace(/\{pg\}/g,n);e.appendChild(t)}
 if(o.t=='img'&&o.src){const i=new Image();i.src=o.src;i.draggable=false;i.style.cssText='width:100%;height:100%;display:block;pointer-events:none;object-fit:'+o.fit;e.appendChild(i)}
 return e}
function guides(s){const g=document.createElement('div'),tw=doc.w-doc.ml-doc.mr,cw=(tw-(doc.cols-1)*doc.gut)/doc.cols,mh=(doc.h-doc.mt-doc.mb)*s;g.className='gd';
 let h=`<i style="left:${doc.ml*s}px;top:${doc.mt*s}px;width:${tw*s}px;height:${mh}px;border:1px solid #e0239a"></i>`;
 if(doc.cols>1)for(let k=0;k<doc.cols;k++)h+=`<i style="left:${(doc.ml+k*(cw+doc.gut))*s}px;top:${doc.mt*s}px;width:${cw*s}px;height:${mh}px;border:1px dashed #19a7d6"></i>`;
 g.innerHTML=h;return g}
function pageEl(p,n,s,u){
 const d=document.createElement('div');d.className='pg';d.style.width=doc.w*s+'px';d.style.height=doc.h*s+'px';
 if(u&&$('#tgd').checked){d.style.backgroundImage='linear-gradient(#0002 1px,transparent 1px),linear-gradient(90deg,#0002 1px,transparent 1px)';d.style.backgroundSize=5*s+'px '+5*s+'px'}
 if(p!==doc.master)doc.master.o.forEach(o=>{const e=oel(o,s,n);if(u)e.classList.add('mst');else e.style.pointerEvents='none';d.appendChild(e)});
 p.o.forEach(o=>{const e=oel(o,s,n);
  if(u&&o===sel){e.classList.add('sel');HD.forEach(([k,x,y])=>{if(o.t=='line'&&k!='e'&&k!='w')return;const h=document.createElement('i');h.className='hd';h.dataset.h=k;h.style.left=x+'%';h.style.top=y+'%';h.style.cursor=k+'-resize';e.appendChild(h)})}
  d.appendChild(e)});
 if(u&&$('#tg').checked)d.appendChild(guides(s));
 return d}
function draw(){const s=K*zoom,st=$('#st');st.innerHTML='';st.appendChild(pageEl(P(),cur<0?'‹nº›':cur+1,s,true));$('#zl').textContent=Math.round(zoom*100)+'%';
 document.querySelectorAll('#st .o.text').forEach(e=>{const t=e.firstChild;if(t.scrollHeight>t.clientHeight+2||t.scrollWidth>t.clientWidth+2)e.classList.add('ov')})}
function zm(d){zoom=Math.min(4,Math.max(.2,zoom+d));draw()}
function fit(){const st=$('#st');zoom=Math.max(.2,Math.floor(Math.min((st.clientHeight-48)/(doc.h*K),(st.clientWidth-48)/(doc.w*K))*20)/20);ui()}
function side(){
 $('#tl').innerHTML=TL.map(t=>`<button data-t="${t[0]}" class="${t[0]==tool?'on':''}" title="${t[2]}">${t[1]}</button>`).join('');
 $('#pgl').innerHTML=`<button data-p="-1" class="${cur<0?'on':''}">Mestre</button>`+doc.pages.map((_,i)=>`<button data-p="${i}" class="${i==cur?'on':''}">${i+1}</button>`).join('');
 $('#ly').innerHTML=P().o.slice().reverse().map(o=>`<div class="li ${o===sel?'sel':''}" data-id="${o.id}">${IC[o.t]} ${o.t=='text'?esc(o.text.slice(0,24)):NM[o.t]}</div>`).join('')||'<span class="mu">Vazia</span>'}
function setTool(k){if(k=='i'){imgFor=null;$('#fi').click();return}tool=k;$('#st').style.cursor=k=='v'?'':'crosshair';side()}
function panel(){
 const R=$('#R'),o=sel;
 if(!o){const D=(l,k,st=1)=>`<label class="r">${l}<input type="number" data-d="${k}" step="${st}" min="0" value="${doc[k]}"></label>`,m=Object.keys(SZ).find(k=>SZ[k][0]==doc.w&&SZ[k][1]==doc.h);
  R.innerHTML=`<h4>Documento ${cur<0?'(página-mestre)':''}</h4><div class="g2"><label class="r full">Tamanho<select data-p="1"><option value="" ${m?'':'selected'}>Personalizado</option>${Object.keys(SZ).map(k=>`<option ${k==m?'selected':''}>${k}</option>`).join('')}</select></label>${D('Largura (mm)','w')}${D('Altura (mm)','h')}</div>
  <h4>Margens (mm)</h4><div class="g2">${D('Superior','mt')}${D('Inferior','mb')}${D('Esquerda','ml')}${D('Direita','mr')}</div>
  <h4>Colunas-guia</h4><div class="g2">${D('Colunas','cols')}${D('Calha (mm)','gut',.5)}</div>
  <p class="mu">Itens da página-mestre (cabeçalho, rodapé, numeração) aparecem em todas as páginas. Use {pg} para o número da página. Selecione um objeto para editar suas propriedades.</p>`;return}
 const N=(l,k,st=1,mn='')=>`<label class="r">${l}<input type="number" data-k="${k}" step="${st}" ${mn!==''?'min="'+mn+'"':''} value="${rd(o[k])}"></label>`,
 C=(l,k)=>`<label class="r">${l}<span style="display:flex;gap:3px"><input type="color" data-k="${k}" value="${o[k]||'#ffffff'}" style="flex:1"><button data-c="${k}" title="Nenhum">∅</button></span></label>`,
 S=(l,k,op)=>`<label class="r">${l}<select data-k="${k}">${op.map(v=>`<option value="${v[0]}" ${v[0]==o[k]?'selected':''}>${v[1]}</option>`).join('')}</select></label>`,
 T=(l,k)=>`<label><input type="checkbox" data-k="${k}" ${o[k]?'checked':''}>${l}</label>`,
 tx=o.t=='text',im=o.t=='img',ln=o.t=='line';
 R.innerHTML=`<h4>${NM[o.t]}</h4><div class="g2">${N('X (mm)','x',.5)}${N('Y (mm)','y',.5)}${N('Largura','w',.5,1)}${ln?'':N('Altura','h',.5,1)}${N('Rotação (°)','r')}${N('Opacidade (%)','op',5,0)}</div>
 <h4>Alinhar</h4><div class="chips">${[['l','⇤','À esquerda da margem'],['c','↔','Centro da página'],['r','⇥','À direita da margem'],['t','⤒','Topo da margem'],['m','↕','Meio da página'],['b','⤓','Base da margem'],['f','▤','Largura da mancha']].map(a=>`<button data-a="${a[0]}" title="${a[2]}">${a[1]}</button>`).join('')}</div>
 ${ln?'<h4>Traço</h4><div class="g2">'+C('Cor','stroke')+N('Espessura (pt)','sw',.25,.25)+'</div>':'<h4>Preenchimento e contorno</h4><div class="g2">'+(im?'':C('Preenchimento','fill'))+C('Contorno','stroke')+N('Espessura (pt)','sw',.25,0)+(o.t=='rect'?N('Canto (mm)','rad',.5,0):'')+'</div>'}
 ${tx?`<h4>Texto</h4><textarea data-k="text" rows="5" style="width:100%">${esc(o.text)}</textarea><div class="g2" style="margin-top:6px">${S('Fonte','ff',FN.map(f=>[f,f.split(',')[0]]))}${N('Tamanho (pt)','fs',.5,1)}${N('Entrelinha','lh',.05,.5)}${S('Alinhamento','al',[['left','Esquerda'],['center','Centro'],['right','Direita'],['justify','Justificado']])}${C('Cor','col')}${N('Recuo 1ª linha (mm)','ind',1)}${N('Espaç. letras (pt)','ls',.1)}${N('Margem interna (mm)','pad',.5,0)}${N('Colunas','cols',1,1)}${N('Calha (mm)','gut',.5,0)}</div><div class="chips" style="margin-top:6px">${T('Negrito','b')}${T('Itálico','i')}${T('Sublinhado','u')}${T('Hifenizar','hy')}</div><p class="mu">Um + vermelho indica texto excedente. Use {pg} para o número da página.</p>`:''}
 ${im?`<h4>Imagem</h4><div class="g2">${S('Ajuste','fit',[['cover','Preencher'],['contain','Conter'],['fill','Esticar']])}<button data-img="1" style="align-self:end">Trocar…</button></div>`:''}
 <h4>Ordem</h4><div class="chips"><button data-z="front">Frente</button><button data-z="up">Avançar</button><button data-z="down">Recuar</button><button data-z="back">Trás</button></div>
 <div class="chips" style="margin-top:8px"><button data-x="dup">Duplicar objeto</button><button data-x="del">Excluir objeto</button></div>`}
function aln(a){const o=sel,L=doc.ml,Rr=doc.w-doc.mr,T=doc.mt,B=doc.h-doc.mb;
 if(a=='l')o.x=L;if(a=='c')o.x=rd((doc.w-o.w)/2);if(a=='r')o.x=rd(Rr-o.w);if(a=='t')o.y=T;if(a=='m')o.y=rd((doc.h-o.h)/2);if(a=='b')o.y=rd(B-o.h);if(a=='f'){o.x=L;o.w=Rr-L}}
function zo(a){const L=P().o,i=L.indexOf(sel);L.splice(i,1);L.splice(a=='front'?L.length:a=='back'?0:a=='up'?Math.min(i+1,L.length):Math.max(i-1,0),0,sel)}
function dup(){if(!sel)return;const c={...sel,id:uid++,x:sel.x+5,y:sel.y+5};P().o.push(c);sel=c}
function del(){const L=P().o;L.splice(L.indexOf(sel),1);sel=null}
function cands(ax){const w=ax?doc.h:doc.w,m1=ax?doc.mt:doc.ml,m2=ax?doc.mb:doc.mr,c=[0,w/2,w,m1,w-m2];
 if(!ax&&doc.cols>1){const cw=(doc.w-doc.ml-doc.mr-(doc.cols-1)*doc.gut)/doc.cols;for(let k=0;k<doc.cols;k++){const a=doc.ml+k*(cw+doc.gut);c.push(a,a+cw)}}
 P().o.forEach(q=>{if(q!==sel&&!q.r){const a=ax?q.y:q.x,b=ax?q.h:q.w;c.push(a,a+b/2,a+b)}});return c}
function sn(vals,cs,g){let best=null;for(const v of vals)for(const c of cs){const d=c-v;if(Math.abs(d)<1.2&&(best===null||Math.abs(d)<Math.abs(best)))best=d}
 if(best===null&&g)best=Math.round(vals[0]/5)*5-vals[0];return best||0}
function drag(ev,mode,h){
 const o=sel,o0={...o},s=K*zoom,sx=ev.clientX,sy=ev.clientY,e=$('#st .o.sel');if(!e)return;let mv=0;
 const cx=cands(0),cy=cands(1),sp=$('#tsn').checked,gr=$('#tgd').checked;
 const m=v=>{const dx=(v.clientX-sx)/s,dy=(v.clientY-sy)/s;mv=1;
  if(mode=='mv'){let x=o0.x+dx,y=o0.y+dy;if(sp&&!o.r){x+=sn([x,x+o.w/2,x+o.w],cx,gr);y+=sn([y,y+o.h/2,y+o.h],cy,gr)}o.x=rd(x);o.y=rd(y)}
  else{const a=o.r*Math.PI/180,c=Math.cos(a),n=Math.sin(a),lx=dx*c+dy*n,ly=-dx*n+dy*c;
   if(h.includes('e'))o.w=Math.max(2,rd(o0.w+lx));
   if(h.includes('s'))o.h=Math.max(2,rd(o0.h+ly));
   if(h.includes('w')){const w=Math.max(2,o0.w-lx);o.x=rd(o0.x+o0.w-w);o.w=rd(w)}
   if(h.includes('n')){const w=Math.max(2,o0.h-ly);o.y=rd(o0.y+o0.h-w);o.h=rd(w)}}
  place(e,o,s)};
 document.addEventListener('pointermove',m);
 document.addEventListener('pointerup',()=>{document.removeEventListener('pointermove',m);if(mv){commit();draw();panel()}},{once:true})}
function mkD(ev){
 const r=pg().getBoundingClientRect(),s=K*zoom,x0=(ev.clientX-r.left)/s,y0=(ev.clientY-r.top)/s,t=tool,
 o=mk({t:'text',m:'rect',l:'ellipse',n:'line'}[t],{x:rd(x0),y:rd(y0),w:1,h:1});
 P().o.push(o);sel=o;draw();const e=$('#st .o.sel');
 const m=v=>{const x=(v.clientX-r.left)/s,y=(v.clientY-r.top)/s;o.x=rd(Math.min(x,x0));o.y=rd(Math.min(y,y0));o.w=rd(Math.abs(x-x0));o.h=rd(Math.abs(y-y0));place(e,o,s)};
 document.addEventListener('pointermove',m);
