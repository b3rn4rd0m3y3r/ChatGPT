<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="ISO-8859-1">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planilha Web - Etapa 3</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#202124;background:#f5f6f8}.app{max-width:1400px;margin:0 auto;padding:14px}h1{font-size:22px;margin:0 0 12px}
.toolbar,.formula-line,.statusbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid #d5d9df;padding:8px;border-radius:6px}.toolbar{margin-bottom:8px}button,select,input{font:inherit}button,select{border:1px solid #c8cdd4;background:#fff;border-radius:4px;padding:6px 9px;cursor:pointer}button:hover{background:#edf4ff}input[type=color]{width:34px;height:30px;padding:2px;border:1px solid #c8cdd4;background:#fff;border-radius:4px}input[type=number]{width:68px;padding:5px;border:1px solid #c8cdd4;border-radius:4px}.formula-line{display:grid;grid-template-columns:90px 1fr;margin-bottom:8px}#cellName{font-weight:bold;text-align:center;padding:8px;background:#f1f3f4;border:1px solid #d5d9df;border-radius:4px}#formula{width:100%;padding:8px;border:1px solid #c8cdd4;border-radius:4px}.sheet-wrap{overflow:auto;background:white;border:1px solid #c8cdd4;max-height:65vh}table{border-collapse:separate;border-spacing:0;table-layout:fixed}th,td{border-right:1px solid #dfe3e8;border-bottom:1px solid #dfe3e8;height:28px;min-width:100px;padding:0;white-space:nowrap}th{background:#edf0f3;color:#4b5563;font-weight:normal;text-align:center;position:sticky;top:0;z-index:2;height:30px}th.row-head{left:0;z-index:3;min-width:44px;width:44px;position:sticky}td.row-head{position:sticky;left:0;z-index:1;background:#edf0f3;text-align:center;color:#4b5563;min-width:44px;width:44px}td.cell{background:#fff;position:relative}td.cell input{border:0;outline:0;width:100%;height:27px;padding:4px 6px;background:transparent;color:inherit;font:inherit}td.cell.selected{outline:2px solid #1a73e8;outline-offset:-2px;z-index:1}td.cell.inrange{background:#e8f0fe}th.col-head{position:sticky;top:0}.resize-handle{position:absolute;right:-2px;top:0;width:5px;height:100%;cursor:col-resize;z-index:5}.statusbar{margin-top:8px;justify-content:space-between;font-size:12px;color:#555}.hint{color:#5f6368;font-size:12px;margin:8px 2px}.sep{width:1px;height:26px;background:#d5d9df;margin:0 3px}@media(max-width:700px){.app{padding:6px}.formula-line{grid-template-columns:65px 1fr}h1{font-size:18px}}
</style>
</head>
<body><div class="app">
<h1>Planilha Web - Etapa 3</h1>
<div class="toolbar">
<button id="newSheet">Nova</button><button id="copyBtn">Copiar</button><button id="cutBtn">Recortar</button><button id="pasteBtn">Colar</button><span class="sep"></span>
<button id="boldBtn" title="Negrito"><b>B</b></button><label>Texto <input id="textColor" type="color" value="#202124"></label><label>Fundo <input id="fillColor" type="color" value="#ffffff"></label><span class="sep"></span>
<button id="currencyBtn">Moeda</button><button id="percentBtn">%</button><label>Casas <select id="decimals"><option value="0">0</option><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></label><button id="numberBtn">Numero</button><span class="sep"></span>
<button id="fillRight">Preencher direita</button><button id="fillDown">Preencher abaixo</button><label>Linhas <input id="rowsInput" type="number" min="5" max="200" value="30"></label><label>Colunas <input id="colsInput" type="number" min="2" max="40" value="12"></label><button id="resizeGrid">Redimensionar</button>
</div>
<div class="formula-line"><div id="cellName">A1</div><input id="formula" aria-label="Conteudo ou formula da celula" placeholder="Digite um valor ou formula, por exemplo =SOMA(A1:A5)"></div>
<div class="sheet-wrap"><table id="sheet"></table></div>
<div class="statusbar"><span id="status">Pronto</span><span id="selectionSummary">Celula: A1</span></div>
<div class="hint">Formulas: =A1+B1, =SOMA(A1:A5), =MEDIA(A1:A5), =MINIMO(A1:A5), =MAXIMO(A1:A5). Use parenteses e separadores ; ou , nas funcoes. Arraste a borda direita do cabecalho para ajustar a largura da coluna. Atalhos: Ctrl+C, Ctrl+X, Ctrl+V, Delete, Ctrl+B.</div>
</div>
<script>
(function(){
"use strict";
var rowCount=30,colCount=12,selected={r:0,c:0},range={r1:0,c1:0,r2:0,c2:0},data={},styles={},widths={},clipboard=null,cutMode=false;
var sheet=document.getElementById("sheet"),formula=document.getElementById("formula"),cellName=document.getElementById("cellName"),status=document.getElementById("status"),summary=document.getElementById("selectionSummary");
function key(r,c){return r+":"+c}function colName(n){var s="";n++;while(n>0){var x=(n-1)%26;s=String.fromCharCode(65+x)+s;n=Math.floor((n-1)/26)}return s}function addr(r,c){return colName(c)+(r+1)}
function parseAddr(s){var m=/^\$?([A-Z]{1,3})\$?(\d+)$/i.exec(s);if(!m)return null;var c=0;for(var i=0;i<m[1].length;i++)c=c*26+m[1].toUpperCase().charCodeAt(i)-64;return {r:parseInt(m[2],10)-1,c:c-1}}
function raw(r,c){return data[key(r,c)]===undefined?"":data[key(r,c)]}function setRaw(r,c,v){if(String(v)==="")delete data[key(r,c)];else data[key(r,c)]=String(v)}function cellStyle(r,c){return styles[key(r,c)]||(styles[key(r,c)]={})}
function inRange(r,c){return r>=Math.min(range.r1,range.r2)&&r<=Math.max(range.r1,range.r2)&&c>=Math.min(range.c1,range.c2)&&c<=Math.max(range.c1,range.c2)}
function selectedCells(){var a=[];for(var r=Math.min(range.r1,range.r2);r<=Math.max(range.r1,range.r2);r++)for(var c=Math.min(range.c1,range.c2);c<=Math.max(range.c1,range.c2);c++)a.push({r:r,c:c});return a}
function setStatus(s){status.textContent=s}function getColWidth(c){return widths[c]||120}
function styleCss(st){var s="";if(st.bold)s+="font-weight:bold;";if(st.color)s+="color:"+st.color+";";if(st.bg)s+="background-color:"+st.bg+";";return s}
function formatValue(v,st){if(v===null||v===undefined||v==="")return "";if(typeof v!=="number"||!isFinite(v))return String(v);var d=st&&st.decimals!==undefined?st.decimals:undefined;if(st&&st.format==="percent")return (v*100).toFixed(d===undefined?2:d)+"%";if(st&&st.format==="currency")return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d});if(d!==undefined)return v.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});return Number(v.toPrecision(10)).toLocaleString("pt-BR",{maximumFractionDigits:10})}
function evalCell(r,c,stack){var k=key(r,c);if(stack.indexOf(k)>=0)throw Error("Referencia circular em "+addr(r,c));var v=raw(r,c);if(v==="")return 0;if(v.charAt(0)!=="="){var n=Number(v.replace(/\./g,"").replace(",","."));if(v.trim()!==""&&isFinite(n))return n;return v}stack.push(k);try{var z=evalFormula(v.substring(1),stack);stack.pop();return z}catch(e){stack.pop();throw e}}
function rangeValues(a,b,stack){var p=parseAddr(a),q=parseAddr(b);if(!p||!q)throw Error("Intervalo invalido");var out=[];for(var r=Math.min(p.r,q.r);r<=Math.max(p.r,q.r);r++)for(var c=Math.min(p.c,q.c);c<=Math.max(p.c,q.c);c++)out.push(evalCell(r,c,stack));return out}
function evalFormula(expr,stack){
 expr=expr.trim();
 expr=expr.replace(/\b(SOMA|MEDIA|M[EÉ]DIA|MINIMO|M[IÍ]NIMO|MAXIMO|M[AÁ]XIMO)\s*\(([^()]*)\)/gi,function(all,fn,args){var vals=[];args.split(/[;,]/).forEach(function(part){part=part.trim();var m=/^([A-Z]{1,3}\d+)\s*:\s*([A-Z]{1,3}\d+)$/i.exec(part);if(m)vals=vals.concat(rangeValues(m[1],m[2],stack));else if(parseAddr(part)){var p=parseAddr(part);vals.push(evalCell(p.r,p.c,stack))}else if(part!=="")vals.push(Number(part.replace(",",".")))});var ns=vals.map(Number).filter(function(n){return isFinite(n)}),f=fn.toUpperCase();if(f==="SOMA")return ns.reduce(function(a,b){return a+b},0);if(f==="MEDIA"||f==="MÉDIA")return ns.length?ns.reduce(function(a,b){return a+b},0)/ns.length:0;if(f==="MINIMO"||f==="MÍNIMO")return ns.length?Math.min.apply(null,ns):0;return ns.length?Math.max.apply(null,ns):0});
 expr=expr.replace(/\b([A-Z]{1,3}\d+)\b/gi,function(ref){var p=parseAddr(ref);if(!p)return ref;var v=evalCell(p.r,p.c,stack);return typeof v==="string"?JSON.stringify(v):String(v)});
 if(!/^[0-9+\-*/().,\s%]+$/.test(expr))throw Error("Formula invalida");expr=expr.replace(/,/g,".");var result=Function('"use strict";return ('+expr+');')();if(typeof result!=="number"||!isFinite(result))throw Error("Resultado invalido");return result
}
function computed(r,c){try{return evalCell(r,c,[])}catch(e){return "#ERRO"}}
function renderGrid(){var h="<thead><tr><th class='row-head'></th>";for(var c=0;c<colCount;c++)h+="<th class='col-head' data-col='"+c+"' style='width:"+getColWidth(c)+"px'>"+colName(c)+"<span class='resize-handle' data-resize='"+c+"'></span></th>";h+="</tr></thead><tbody>";for(var r=0;r<rowCount;r++){h+="<tr><td class='row-head'>"+(r+1)+"</td>";for(var j=0;j<colCount;j++)h+="<td class='cell' data-r='"+r+"' data-c='"+j+"' style='width:"+getColWidth(j)+"px'><input aria-label='"+addr(r,j)+"' data-r='"+r+"' data-c='"+j+"' autocomplete='off' spellcheck='false'></td>";h+="</tr>"}sheet.innerHTML=h+"</tbody>";sheet.querySelectorAll("td.cell input").forEach(function(inp){inp.addEventListener("focus",function(){selectCell(+this.dataset.r,+this.dataset.c,false)});inp.addEventListener("input",function(){setRaw(+this.dataset.r,+this.dataset.c,this.value)});inp.addEventListener("keydown",onCellKey)});sheet.querySelectorAll("[data-resize]").forEach(function(el){el.addEventListener("mousedown",startResize)});sheet.querySelectorAll("td.cell").forEach(function(td){td.addEventListener("mousedown",function(e){var r=+td.dataset.r,c=+td.dataset.c;if(e.shiftKey){selected={r:r,c:c};range.r2=r;range.c2=c;renderAll()}else selectCell(r,c,false)})});renderAll()}
function renderAll(){sheet.querySelectorAll("td.cell input").forEach(function(inp){var r=+inp.dataset.r,c=+inp.dataset.c,v=raw(r,c),st=cellStyle(r,c),td=inp.parentElement;td.classList.toggle("selected",r===selected.r&&c===selected.c);td.classList.toggle("inrange",inRange(r,c)&&!(r===selected.r&&c===selected.c));td.style.cssText="width:"+getColWidth(c)+"px;"+styleCss(st);if(document.activeElement!==inp){var val=v;if(v.charAt(0)==="="){var cv=computed(r,c);val=cv==="#ERRO"?"#ERRO":formatValue(cv,st)}else if(v!==""){var n=Number(v.replace(",","."));if(isFinite(n)&&v.trim()!=="")val=formatValue(n,st)}inp.value=val}});cellName.textContent=addr(selected.r,selected.c);if(document.activeElement!==formula)formula.value=raw(selected.r,selected.c);var cells=selectedCells(),nums=cells.map(function(p){return computed(p.r,p.c)}).filter(function(v){return typeof v==="number"&&isFinite(v)});summary.textContent=cells.length===1?"Celula: "+addr(selected.r,selected.c):cells.length+" celulas selecionadas"+(nums.length?" | Soma: "+formatValue(nums.reduce(function(a,b){return a+b},0),{}):"")}
function selectCell(r,c,focus){if(r<0||c<0||r>=rowCount||c>=colCount)return;selected={r:r,c:c};range={r1:r,c1:c,r2:r,c2:c};renderAll();if(focus!==false){var inp=sheet.querySelector('input[data-r="'+r+'"][data-c="'+c+'"]');if(inp)inp.focus()}}
function commitFormula(){setRaw(selected.r,selected.c,formula.value);renderAll();setStatus("Celula "+addr(selected.r,selected.c)+" atualizada")}
formula.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();commitFormula();selectCell(Math.min(selected.r+1,rowCount-1),selected.c,true)}else if(e.key==="Escape"){formula.value=raw(selected.r,selected.c);formula.blur()}});formula.addEventListener("change",commitFormula);
function onCellKey(e){var r=+this.dataset.r,c=+this.dataset.c;if(e.key==="Enter"){e.preventDefault();setRaw(r,c,this.value);selectCell(Math.min(r+1,rowCount-1),c,true)}else if(e.key==="Tab"){e.preventDefault();setRaw(r,c,this.value);selectCell(r,Math.min(c+1,colCount-1),true)}else if(e.key==="Escape"){this.value=raw(r,c);this.blur()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="b"){e.preventDefault();toggleBold()}}
function clearSelection(){selectedCells().forEach(function(p){setRaw(p.r,p.c,"")});renderAll();setStatus("Conteudo apagado")}
function copySelection(cut){var cells=selectedCells(),minR=Math.min(range.r1,range.r2),minC=Math.min(range.c1,range.c2);clipboard={rows:Math.abs(range.r2-range.r1)+1,cols:Math.abs(range.c2-range.c1)+1,items:[]};cells.forEach(function(p){clipboard.items.push({dr:p.r-minR,dc:p.c-minC,v:raw(p.r,p.c),st:Object.assign({},cellStyle(p.r,p.c))})});cutMode=!!cut;setStatus(cut?"Intervalo recortado; escolha destino":"Intervalo copiado")}
function pasteSelection(){if(!clipboard)return;var dr=selected.r,dc=selected.c;clipboard.items.forEach(function(it){var r=dr+it.dr,c=dc+it.dc;if(r<rowCount&&c<colCount){setRaw(r,c,it.v);styles[key(r,c)]=Object.assign({},it.st)}});if(cutMode){var mr=Math.min(range.r1,range.r2),mc=Math.min(range.c1,range.c2);clipboard.items.forEach(function(it){setRaw(mr+it.dr,mc+it.dc,"")});cutMode=false}renderAll();setStatus("Colagem concluida")}
function fill(dir){var r1=Math.min(range.r1,range.r2),r2=Math.max(range.r1,range.r2),c1=Math.min(range.c1,range.c2),c2=Math.max(range.c1,range.c2);if(dir==="right"){for(var r=r1;r<=r2;r++){var v=raw(r,c1),st=Object.assign({},cellStyle(r,c1));for(var c=c1+1;c<=c2;c++){setRaw(r,c,v);styles[key(r,c)]=Object.assign({},st)}}}else{for(var x=c1;x<=c2;x++){var vv=raw(r1,x),ss=Object.assign({},cellStyle(r1,x));for(var y=r1+1;y<=r2;y++){setRaw(y,x,vv);styles[key(y,x)]=Object.assign({},ss)}}}renderAll();setStatus("Preenchimento concluido")}
function applyStyle(fn){selectedCells().forEach(function(p){fn(cellStyle(p.r,p.c))});renderAll()}function toggleBold(){applyStyle(function(st){st.bold=!st.bold})}
document.getElementById("boldBtn").onclick=toggleBold;document.getElementById("textColor").oninput=function(){var v=this.value;applyStyle(function(st){st.color=v})};document.getElementById("fillColor").oninput=function(){var v=this.value;applyStyle(function(st){st.bg=v})};
document.getElementById("currencyBtn").onclick=function(){applyStyle(function(st){st.format="currency";st.decimals=+document.getElementById("decimals").value})};document.getElementById("percentBtn").onclick=function(){applyStyle(function(st){st.format="percent";st.decimals=+document.getElementById("decimals").value})};document.getElementById("numberBtn").onclick=function(){applyStyle(function(st){st.format="number";st.decimals=+document.getElementById("decimals").value})};document.getElementById("decimals").onchange=function(){var d=+this.value;applyStyle(function(st){if(st.format)st.decimals=d})};
document.getElementById("copyBtn").onclick=function(){copySelection(false)};document.getElementById("cutBtn").onclick=function(){copySelection(true)};document.getElementById("pasteBtn").onclick=pasteSelection;document.getElementById("fillRight").onclick=function(){fill("right")};document.getElementById("fillDown").onclick=function(){fill("down")};
document.getElementById("newSheet").onclick=function(){if(confirm("Apagar os dados e criar uma planilha vazia?")){data={};styles={};widths={};selected={r:0,c:0};range={r1:0,c1:0,r2:0,c2:0};renderGrid();setStatus("Nova planilha")}};
function startResize(e){e.preventDefault();var c=+this.dataset.resize,x=e.clientX,w=getColWidth(c);function move(ev){widths[c]=Math.max(55,Math.min(500,w+ev.clientX-x));sheet.querySelectorAll("[data-col='"+c+"'],td[data-c='"+c+"']").forEach(function(el){el.style.width=widths[c]+"px";el.style.minWidth=widths[c]+"px"})}function up(){document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up);setStatus("Largura da coluna "+colName(c)+": "+getColWidth(c)+" px")}document.addEventListener("mousemove",move);document.addEventListener("mouseup",up)}
document.getElementById("resizeGrid").onclick=function(){var nr=+document.getElementById("rowsInput").value,nc=+document.getElementById("colsInput").value;if(!Number.isInteger(nr)||!Number.isInteger(nc)||nr<5||nr>200||nc<2||nc>40){setStatus("Use 5 a 200 linhas e 2 a 40 colunas");return}rowCount=nr;colCount=nc;selected={r:Math.min(selected.r,nr-1),c:Math.min(selected.c,nc-1)};range={r1:selected.r,c1:selected.c,r2:selected.r,c2:selected.c};renderGrid();setStatus("Grade redimensionada")};
document.addEventListener("keydown",function(e){if(e.target===formula||e.target.closest&&e.target.closest("td.cell"))return;if(e.ctrlKey||e.metaKey){var k=e.key.toLowerCase();if(k==="c"){e.preventDefault();copySelection(false)}else if(k==="x"){e.preventDefault();copySelection(true)}else if(k==="v"){e.preventDefault();pasteSelection()}else if(k==="b"){e.preventDefault();toggleBold()}return}if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();clearSelection()}else if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.key)>=0){e.preventDefault();var r=selected.r,c=selected.c;if(e.key==="ArrowUp")r--;if(e.key==="ArrowDown")r++;if(e.key==="ArrowLeft")c--;if(e.key==="ArrowRight")c++;selectCell(Math.max(0,Math.min(rowCount-1,r)),Math.max(0,Math.min(colCount-1,c)),true)}});
document.addEventListener("copy",function(e){if(e.target===formula||e.target.closest&&e.target.closest("td.cell"))return;if(!clipboard)copySelection(false);if(clipboard){var lines=[];for(var r=0;r<clipboard.rows;r++){var vals=[];for(var c=0;c<clipboard.cols;c++){var it=clipboard.items.find(function(x){return x.dr===r&&x.dc===c});vals.push(it?it.v:"")}lines.push(vals.join("\t"))}e.clipboardData.setData("text/plain",lines.join("\n"));e.preventDefault()}});
document.addEventListener("paste",function(e){if(e.target===formula||e.target.closest&&e.target.closest("td.cell"))return;var txt=e.clipboardData.getData("text/plain");if(!txt)return;e.preventDefault();txt.split(/\r?\n/).forEach(function(line,dr){line.split("\t").forEach(function(v,dc){var r=selected.r+dr,c=selected.c+dc;if(r<rowCount&&c<colCount)setRaw(r,c,v)})});renderAll();setStatus("Dados colados")});
renderGrid();
})();
</script></body></html>
