<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Fluidos e Hidráulica</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f6;--panel:#fff;--line:#d3dbe4;--tx:#1d2a38;--mut:#6a7a8c;--acc:#1d6fb8;--accbg:#e4f0fb;--water:#2f86d6;--pipe:#a9bccf;--ink:#3f5167;--grid:#dfe6ee;--warn:#b86a00;--ok:#1f8a4c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12181f;--panel:#1b232d;--line:#2e3a48;--tx:#e3eaf2;--mut:#8b9bad;--acc:#58a6ee;--accbg:#1c3045;--water:#3b97ec;--pipe:#5a7088;--ink:#9fb2c7;--grid:#222c37;--warn:#e0a040;--ok:#4cc27f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12181f;--panel:#1b232d;--line:#2e3a48;--tx:#e3eaf2;--mut:#8b9bad;--acc:#58a6ee;--accbg:#1c3045;--water:#3b97ec;--pipe:#5a7088;--ink:#9fb2c7;--grid:#222c37;--warn:#e0a040;--ok:#4cc27f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600;flex:1;white-space:nowrap}
header h1 span{color:var(--mut);font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button:hover{border-color:var(--acc);color:var(--acc)}
button.danger:hover{border-color:#d33;color:#d33}
main{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr 320px}
aside{background:var(--panel);overflow-y:auto;padding:10px}
#left{border-right:1px solid var(--line)}#right{border-left:1px solid var(--line)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 6px}
h2:first-child{margin-top:0}
.card{border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:6px;cursor:grab;background:var(--bg);display:flex;align-items:center;gap:6px}
.card:hover{border-color:var(--acc)}
.card b{flex:1;font-weight:500;font-size:13px}
.card select{width:92px}
.card button{padding:1px 8px;font-weight:700}
select,input[type=number],input[type=text]{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:3px 5px;min-width:0}
#cv{position:relative;min-width:0;min-height:0}
svg{width:100%;height:100%;display:block;background:var(--bg);touch-action:none}
#hint{position:absolute;left:10px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--mut);font-size:12px}
.row{display:grid;grid-template-columns:1fr 112px;gap:6px;align-items:center;margin-bottom:6px}
.row label{color:var(--mut)}
.row .u{display:flex;align-items:center;gap:4px}.row .u input,.row .u select{width:100%}.row .u i{font-style:normal;color:var(--mut);font-size:11px}
.box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.kv{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.kv span:first-child{color:var(--mut)}
.tag{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px}
.warn{color:var(--warn);font-size:12px;margin:4px 0}.ok{color:var(--ok)}
.pend{color:var(--mut);font-style:italic}
.lw{stroke:var(--water);stroke-width:6;stroke-linecap:round}.lo{stroke:var(--ink);stroke-width:9;stroke-linecap:round}
.hit{stroke:transparent;stroke-width:16}.lk.sel .lo{stroke:var(--acc)}
.pt{fill:var(--panel);stroke:var(--acc);stroke-width:2;cursor:crosshair}.pt.used{fill:var(--water)}.pt.pend{fill:#f5a623;stroke:#f5a623}
.pt:hover{r:8}
.nd{cursor:move}.selbox{fill:none;stroke:var(--acc);stroke-dasharray:4 3;opacity:0}.nd.sel .selbox{opacity:1}
text{fill:var(--tx);font-size:15px;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}.tn{font-size:17px;font-weight:600}.tl{fill:var(--mut)}.tr{fill:var(--acc);font-weight:600}
.sh{fill:var(--panel);stroke:var(--ink);stroke-width:2}
@media (max-width:860px){main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;overflow-y:auto}#left,#right{border:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header>
 <h1>💧 Simulador de Fluidos e Hidráulica <span>v0.2 · solver</span></h1>
 <button id="bEx">Exemplo</button><button id="bSv">Salvar</button><button id="bLd">Carregar</button><button id="bCl" class="danger">Limpar</button>
</header>
<main>
 <aside id="left"></aside>
 <section id="cv">
  <svg id="svg" viewBox="0 0 1400 900" preserveAspectRatio="xMinYMin meet">
   <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="var(--grid)"/></pattern></defs>
   <rect id="bg" width="1400" height="900" fill="url(#g)"/><g id="L"></g>
  </svg>
  <div id="hint"></div>
 </section>
 <aside id="right"></aside>
</main>
<script>
const $=s=>document.querySelector(s);
const DN=[[20,17],[25,21.6],[32,27.8],[40,35.2],[50,44],[60,53.4],[75,66.6],[100,97.8],[150,144]];
const PUMPS={.25:[15,3],.5:[22,6],1:[30,10],2:[38,18],3:[45,26],5:[55,40],7.5:[60,55],10:[65,70]};
const VT={gaveta:[.2,'Registro de gaveta'],esfera:[.1,'Registro de esfera'],globo:[10,'Registro de globo'],retencao:[2.5,'Válvula de retenção']};
const KIND={p:'Pressão',q:'Vazão',both:'Pressão + vazão'};
const PRE={pipe:'C',tank:'R',pump:'B',elbow:'J',tee:'T',valve:'V',meter:'M'};
const TN={pipe:'Cano',tank:'Reservatório',pump:'Bomba',elbow:'Joelho',tee:'Conexão T',valve:'Registro',meter:'Medidor'};
const base={
 pipe:()=>({dn:50,len:10,c:140,rug:.06,q:10}),
 tank:()=>({cap:10000,h:2.5,lvl:50}),
 pump:()=>({cv:3,h0:45,qmax:26,eff:65,on:true}),
 elbow:()=>({dn:50,angle:90,k:.9,q:10}),
 tee:()=>({dn:50,k:1,q:10}),
 valve:()=>({dn:50,vt:'gaveta',k:.2,open:100,q:10}),
 meter:()=>({dn:50,kind:'both',unit:'mca'})
};
const P=[
 {g:'Condutos',t:'pipe',n:'Cano PVC',k:'dn',o:DN.map(d=>d[0]),f:v=>'DN '+v,d:50},
 {g:'Reservatórios',t:'tank',n:'Reservatório',k:'cap',o:[2000,5000,10000,20000],f:v=>v/1000+' mil L',d:5000},
 {g:'Bombas',t:'pump',n:'Bomba',k:'cv',o:Object.keys(PUMPS).map(Number),f:v=>v+' cv',d:3},
 {g:'Conexões',t:'elbow',n:'Joelho 90°',k:'dn',o:DN.map(d=>d[0]),f:v=>'DN '+v,d:50,x:{angle:90,k:.9}},
 {t:'elbow',n:'Joelho 45°',k:'dn',o:DN.map(d=>d[0]),f:v=>'DN '+v,d:50,x:{angle:45,k:.4}},
 {t:'tee',n:'Conexão T',k:'dn',o:DN.map(d=>d[0]),f:v=>'DN '+v,d:50},
 {g:'Registros',t:'valve',n:'Gaveta',k:'dn',o:DN.map(d=>d[0]),f:v=>'DN '+v,d:50,x:{vt:'gaveta',k:.2}},
 {t:'valve',n:'Esfera',k:'dn',o:DN.map(d=>d[0]),f:v=>'DN '+v,d:50,x:{vt:'esfera',k:.1}},
 {t:'valve',n:'Globo',k:'dn',o:DN.map(d=>d[0]),f:v=>'DN '+v,d:50,x:{vt:'globo',k:10}},
 {t:'valve',n:'Retenção',k:'dn',o:DN.map(d=>d[0]),f:v=>'DN '+v,d:50,x:{vt:'retencao',k:2.5}},
 {g:'Medição',t:'meter',n:'Medidor',k:'kind',o:['both','p','q'],f:v=>KIND[v],d:'both'}
];
const S={nodes:[],links:[],sel:null,pend:null,id:1,cnt:{}};
const node=id=>S.nodes.find(n=>n.id==id);
const diam=n=>(DN.find(d=>d[0]==n.p.dn)||DN[4])[1]/1000;
function add(t,extra,x,y){
 const n={id:S.id++,type:t,x,y,rot:0,p:{...base[t](),...extra}};
 S.cnt[t]=(S.cnt[t]||0)+1;n.p.name=PRE[t]+S.cnt[t];n.p.z=0;
 if(t=='pump'&&PUMPS[n.p.cv]){n.p.h0=PUMPS[n.p.cv][0];n.p.qmax=PUMPS[n.p.cv][1]}
 S.nodes.push(n);return n}
function ports(n){const t=n.type;
 if(t=='tee')return[[-40,0],[40,0],[0,40]];
 if(t=='elbow')return n.p.angle==45?[[-40,0],[28,-28]]:[[-40,0],[0,40]];
 return[[-40,0],[40,0]]}
function wp(n,i){const[dx,dy]=ports(n)[i],a=n.rot*Math.PI/2,c=Math.round(Math.cos(a)),s=Math.round(Math.sin(a));
 return[n.x+dx*c-dy*s,n.y+dx*s+dy*c]}
const used=(id,p)=>S.links.some(l=>(l.a.id==id&&l.a.p==p)||(l.b.id==id&&l.b.p==p));
function specOld(n){const p=n.p;switch(n.type){
 case'pipe':return`DN${p.dn} · ${p.len} m`;case'tank':return`${p.cap/1000} mil L`;case'pump':return`${p.cv} cv`;
 case'elbow':return`${p.angle}° DN${p.dn}`;case'tee':return`DN${p.dn}`;case'valve':return`${VT[p.vt][1].split(' ').pop()} DN${p.dn}`;
 default:return KIND[p.kind]}}
const conn=d=>`<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="${12}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="var(--pipe)" stroke-width="8" stroke-linecap="round"/>`;
function sym(n){const p=n.p;switch(n.type){
 case'pipe':{const h=6+p.dn/14;return`<rect x="-40" y="${-h/2}" width="80" height="${h}" rx="3" fill="var(--pipe)" stroke="var(--ink)" stroke-width="2"/>`}
 case'tank':return`<line x1="-40" x2="-28" stroke="var(--ink)" stroke-width="4"/><line x1="28" x2="40" stroke="var(--ink)" stroke-width="4"/><rect class="sh" x="-28" y="-30" width="56" height="60" rx="4"/><rect x="-26" y="${28-56*p.lvl/100}" width="52" height="${56*p.lvl/100}" fill="var(--water)" opacity=".75"/>`;
 case'pump':return conn('M-40 0H-16M16 0H40')+`<circle class="sh" r="16" fill="${p.on?'var(--accbg)':'var(--panel)'}"/><polygon points="-6,-9 -6,9 10,0" fill="${p.on?'var(--acc)':'var(--mut)'}"/>`;
 case'elbow':return conn(p.angle==45?'M-40 0H0L28-28':'M-40 0H0V40');
 case'tee':return conn('M-40 0H40M0 0V40');
 case'valve':{const v=p.vt;let s=conn('M-40 0H-14M14 0H40');
  s+=v=='gaveta'?`<polygon class="sh" points="-14,-12 -14,12 14,-12 14,12"/>`:v=='retencao'?`<polygon class="sh" points="-10,-10 -10,10 10,0"/><line x1="10" x2="10" y1="-11" y2="11" stroke="var(--ink)" stroke-width="3"/>`:`<circle class="sh" r="12"/>${v=='esfera'?'<circle r="5" fill="var(--ink)"/>':'<path d="M-8-8L8 8M-8 8L8-8" stroke="var(--ink)" stroke-width="2"/>'}`;
  return s+(v!='retencao'?`<line y1="-12" y2="-24" stroke="var(--ink)" stroke-width="2"/><rect x="-8" y="-28" width="16" height="5" rx="2" fill="var(--ink)"/>`:'')}
 default:return conn('M-40 0H40')+`<line y2="-14" stroke="var(--ink)" stroke-width="3"/><circle class="sh" cy="-28" r="15"/><path d="M-8-24A9 9 0 0 1 8-24" fill="none" stroke="var(--acc)" stroke-width="2"/><line x1="0" y1="-24" x2="5" y2="-31" stroke="var(--acc)" stroke-width="2"/>`}}
function draw(){if(!moving)sim();let h='';
 for(const l of S.links){const a=wp(node(l.a.id),l.a.p),b=wp(node(l.b.id),l.b.p),s=S.sel&&S.sel.k=='l'&&S.sel.id==l.id;
  const c=`x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"`;
  h+=`<g class="lk${s?' sel':''}" data-l="${l.id}"><line class="lo" ${c}/><line class="lw" ${c}/><line class="hit" ${c}/></g>`}
 for(const n of S.nodes){const s=S.sel&&S.sel.k=='n'&&S.sel.id==n.id;
  h+=`<g class="nd${s?' sel':''}" data-n="${n.id}" transform="translate(${n.x} ${n.y})"><rect class="selbox" x="-52" y="-48" width="104" height="96" rx="8"/><g transform="rotate(${n.rot*90})">${sym(n)}`;
  ports(n).forEach((q,i)=>{const pe=S.pend&&S.pend.id==n.id&&S.pend.p==i;h+=`<circle class="pt${used(n.id,i)?' used':''}${pe?' pend':''}" data-n="${n.id}" data-p="${i}" cx="${q[0]}" cy="${q[1]}" r="6"/>`});
  h+=`</g>${[n.p.name,...spec(n)].map((t,i)=>`<text class="${i?(n.type=='meter'?'tr':'tl'):'tn'}" y="${64+i*18}">${t}</text>`).join('')}</g>`}
 $('#L').innerHTML=h;
 $('#hint').textContent=S.pend?'Clique em outra porta livre para conectar (Esc cancela)':'Clique numa porta (●) e depois em outra para conectar · R gira · Del exclui'}
/* ---------- paleta ---------- */
function buildPalette(){let h='';
 P.forEach((it,i)=>{if(it.g)h+=`<h2>${it.g}</h2>`;
  h+=`<div class="card" draggable="true" data-i="${i}"><b>${it.n}</b><select>${it.o.map(v=>`<option value="${v}"${v==it.d?' selected':''}>${it.f(v)}</option>`).join('')}</select><button title="Adicionar">+</button></div>`});
 $('#left').innerHTML='<h2>Componentes</h2><div class="pend" style="margin-bottom:6px">Arraste para a área ou use “+”.</div>'+h}
function fromCard(c,x,y){const it=P[c.dataset.i];let v=c.querySelector('select').value;if(it.k!='kind')v=+v;
 const n=add(it.t,{...(it.x||{}),[it.k]:v},x,y);
 if(it.t=='valve')n.p.q=10;S.sel={k:'n',id:n.id};draw();props();return n}
let slot=0;
$('#left').addEventListener('click',e=>{if(e.target.tagName!='BUTTON')return;slot++;fromCard(e.target.closest('.card'),160+(slot%8)*130,120+Math.floor(slot/8%5)*130)});
$('#left').addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(c)e.dataTransfer.setData('text/plain',c.dataset.i+'|'+c.querySelector('select').value)});
const svg=$('#svg');
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const r=p.matrixTransform(svg.getScreenCTM().inverse());return[r.x,r.y]}
const snap=v=>Math.round(v/20)*20;
svg.addEventListener('dragover',e=>e.preventDefault());
svg.addEventListener('drop',e=>{e.preventDefault();const[i,v]=(e.dataTransfer.getData('text/plain')||'').split('|');if(i==null||!P[i])return;
 const c=document.querySelector(`.card[data-i="${i}"]`);c.querySelector('select').value=v;const[x,y]=pt(e);fromCard(c,snap(x),snap(y))});
/* ---------- interação ---------- */
let drag=null;
svg.addEventListener('pointerdown',e=>{const t=e.target;
 if(t.classList.contains('pt')){const id=+t.dataset.n,p=+t.dataset.p;if(used(id,p))return;
  if(!S.pend){S.pend={id,p}}else if(S.pend.id!=id){S.links.push({id:S.id++,a:S.pend,b:{id,p}});S.pend=null}else S.pend=null;
  draw();props();return}
 S.pend=null;const g=t.closest('[data-n]'),l=t.closest('[data-l]');
 if(g){const n=node(g.dataset.n),[x,y]=pt(e);S.sel={k:'n',id:n.id};drag={n,dx:n.x-x,dy:n.y-y}}
 else if(l)S.sel={k:'l',id:+l.dataset.l};else S.sel=null;
 draw();props()});
window.addEventListener('pointermove',e=>{if(!drag)return;const[x,y]=pt(e);drag.n.x=snap(x+drag.dx);drag.n.y=snap(y+drag.dy);moving=1;draw();moving=0});
window.addEventListener('pointerup',()=>{drag=null});
window.addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(document.activeElement.tagName))return;
 if(e.key=='Escape'){S.pend=null;draw()}
 if(e.key=='Delete'||e.key=='Backspace')del();
 if(e.key=='r'||e.key=='R')rot()});
function del(){const s=S.sel;if(!s)return;
 if(s.k=='l')S.links=S.links.filter(l=>l.id!=s.id);
 else{S.nodes=S.nodes.filter(n=>n.id!=s.id);S.links=S.links.filter(l=>l.a.id!=s.id&&l.b.id!=s.id)}
 S.sel=null;draw();props()}
function rot(){const s=S.sel;if(s&&s.k=='n'){const n=node(s.id);n.rot=(n.rot+1)%4;draw();props()}}
/* ---------- hidráulica (pré-visualização) ---------- */
const G=9.81;
function derived(n){const p=n.p,o=[],f=(x,d=2)=>Number.isFinite(x)?x.toFixed(d):'—';
 if(['pipe','elbow','tee','valve','meter'].includes(n.type)){
  const D=diam(n),A=Math.PI*D*D/4,Q=(p.q||0)/3600,v=Q/A;
  o.push(['Diâmetro interno',f(D*1000,1)+' mm'],['Área da seção',f(A*1e4,2)+' cm²']);
  if(n.type=='pipe'){const hf=10.643*p.len*Math.pow(Q,1.852)/(Math.pow(p.c,1.852)*Math.pow(D,4.87));
   o.push(['Velocidade (Q teste)',f(v)+' m/s'],['Perda unitária J',f(hf/p.len*100)+' m/100 m'],['Perda total hf',f(hf,3)+' m.c.a.']);
   if(v>3)o.push(['⚠','velocidade acima de 3 m/s'])}
  else if(n.type!='meter'){const k=p.k*(n.type=='valve'&&p.open<100?100/Math.max(p.open,1):1);o.push(['Velocidade (Q teste)',f(v)+' m/s'],['K efetivo',f(k)],['Perda local hl',f(k*v*v/2/G,3)+' m.c.a.'])}
 }
 if(n.type=='tank'){const A=p.cap/1000/p.h;o.push(['Área da base',f(A)+' m²'],['Volume atual',f(p.cap*p.lvl/100,0)+' L'],['Altura da lâmina',f(p.h*p.lvl/100)+' m'],['Cota da superfície',f(p.z+p.h*p.lvl/100)+' m'])}
 if(n.type=='pump'){o.push(['Potência nominal',f(p.cv*.7355)+' kW'],['H a Q = Qmáx/2',f(p.h0*(1-.25))+' m.c.a.'],['Pot. hidráulica em Qmáx/2',f(1000*G*(p.qmax/7200)*p.h0*.75/1000)+' kW'])}
 return o}
/* ---------- propriedades ---------- */
const dnSel=['dn','Diâmetro nominal','dn'],Z=['z','Cota do eixo','num','m',-50,500,.1],QT=['q','Vazão de teste','num','m³/h',0,500,.1];
const FIELDS={
 pipe:[dnSel,['len','Comprimento','num','m',.1,1000,.1],['c','C (Hazen-Williams)','num','',60,160,1],['rug','Rugosidade abs.','num','mm',0,5,.001],Z,QT],
 tank:[['cap','Capacidade','sel',[2000,5000,10000,20000],v=>v/1000+' mil L'],['h','Altura útil','num','m',.5,10,.1],['lvl','Nível inicial','num','%',0,100,1],Z],
 pump:[['cv','Potência','sel',Object.keys(PUMPS).map(Number),v=>v+' cv'],['h0','Altura shutoff H₀','num','m.c.a.',1,200,.1],['qmax','Vazão máx. (H=0)','num','m³/h',.5,300,.1],['eff','Rendimento','num','%',10,95,1],['on','Ligada','bool'],Z],
 elbow:[dnSel,['angle','Ângulo','sel',[90,45],v=>v+'°'],['k','Coef. K','num','',0,20,.01],Z,QT],
 tee:[dnSel,['k','Coef. K','num','',0,20,.01],Z,QT],
 valve:[['vt','Tipo','sel',Object.keys(VT),v=>VT[v][1]],dnSel,['open','Abertura','num','%',0,100,1],['k','Coef. K (aberto)','num','',0,50,.01],Z,QT],
 meter:[['kind','Grandeza','sel',['both','p','q'],v=>KIND[v]],dnSel,['unit','Unidade de pressão','sel',['mca','kPa','bar'],v=>v],Z]
};
function field(f,v){const[k,l,t,a,b,c,d]=f;let i;
 if(t=='dn')i=`<select data-k="${k}">${DN.map(x=>`<option value="${x[0]}"${x[0]==v?' selected':''}>DN ${x[0]} mm</option>`).join('')}</select>`;
 else if(t=='sel')i=`<select data-k="${k}">${a.map(x=>`<option value="${x}"${x==v?' selected':''}>${b(x)}</option>`).join('')}</select>`;
 else if(t=='bool')i=`<input type="checkbox" data-k="${k}"${v?' checked':''}>`;
 else i=`<span class="u"><input type="number" data-k="${k}" value="${v}" min="${b}" max="${c}" step="${d}"><i>${a}</i></span>`;
 return`<div class="row"><label>${l}</label><div class="u">${i}</div></div>`}
function props(){const R=$('#right'),s=S.sel;
 if(!s){const pm=S.nodes.filter(n=>n.type=='meter').length;
  R.innerHTML=`<h2>Propriedades</h2><div class="pend">Selecione um componente.</div><h2>Rede</h2><div class="box"><div class="kv"><span>Componentes</span><span>${S.nodes.length}</span></div><div class="kv"><span>Conexões</span><span>${S.links.length}</span></div><div class="kv"><span>Medidores</span><span>${pm}</span></div></div>${simStatus()}`;return}
 if(s.k=='l'){R.innerHTML=`<h2>Conexão</h2><button class="danger" onclick="del()">Excluir conexão</button>`;return}
 const n=node(s.id),p=n.p;let h=`<h2>${TN[n.type]}<span class="tag">#${n.id}</span></h2><div class="row"><label>Nome / TAG</label><input type="text" data-k="name" value="${p.name}"></div>`;
 FIELDS[n.type].forEach(f=>h+=field(f,p[f[0]]));
 const nb=[];S.links.forEach(l=>{if(l.a.id==n.id)nb.push(node(l.b.id));if(l.b.id==n.id)nb.push(node(l.a.id))});
 nb.forEach(m=>{if(p.dn&&m.p.dn&&m.p.dn!=p.dn)h+=`<div class="warn">⚠ Ligado a ${m.p.name} (DN ${m.p.dn}): requer redução/bucha.</div>`});
 if(n.type!='meter')h+=resBox(n);const d=derived(n);if(d.length)h+='<h2>Cálculo (pré-visualização)</h2><div class="box">'+d.map(x=>`<div class="kv"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')+'</div>';
 if(n.type=='meter')h+=`<h2>Leituras</h2><div class="box"><div class="kv"><span>Pressão</span><b>${fmt(pm(n,p.unit))} ${p.unit}</b></div><div class="kv"><span>Vazão</span><b>${fmt(qh(n)==null?null:Math.abs(qh(n)))} m³/h</b></div><div class="kv"><span>Conectado a</span><span>${nb.length}/2 portas</span></div></div>${S.res.ok?'':'<div class="warn">'+S.res.msg+'</div>'}`;
 h+=`<h2>Conexões</h2><div class="kv"><span>Portas ocupadas</span><span class="${nb.length==ports(n).length?'ok':''}">${nb.length}/${ports(n).length}</span></div><div style="display:flex;gap:6px;margin-top:10px"><button onclick="rot()">⟳ Girar (R)</button><button class="danger" onclick="del()">Excluir</button></div>`;
 R.innerHTML=h}
$('#right').addEventListener('change',e=>{const k=e.target.dataset.k;if(!k||!S.sel)return;const n=node(S.sel.id),p=n.p;
 let v=e.target.type=='checkbox'?e.target.checked:e.target.type=='number'?parseFloat(e.target.value):e.target.value;
 if(e.target.type=='number'&&!Number.isFinite(v))v=p[k];
 if(e.target.tagName=='SELECT'&&['dn','cap','cv','angle'].includes(k))v=+v;
 p[k]=v;
 if(k=='cv'&&PUMPS[v]){p.h0=PUMPS[v][0];p.qmax=PUMPS[v][1]}
 if(k=='vt')p.k=VT[v][0];
 if(k=='angle')p.k=v==45?.4:.9;
 draw();props()});
/* ---------- solver (etapa 2): regime permanente, método de Newton nodal ---------- */
let moving=0;
const UP={mca:1,kPa:9.80665,bar:.0980665};
const hz=n=>n.p.z||0;
const fmt=(v,d=2)=>v==null||!Number.isFinite(v)?'—':v.toFixed(d);
const pm=(n,u)=>{const R=S.res;if(!R||!R.ok)return null;const H=R.H[n.id];if(!H||H[0]==null||H[1]==null)return null;return((H[0]+H[1])/2-hz(n))*UP[u]};
const qh=n=>{const R=S.res;return R&&R.ok&&R.Q[n.id]!=null?R.Q[n.id]*3600:null};
function spec(n){const p=n.p;switch(n.type){
 case'pipe':return[`DN ${p.dn} mm`,`${p.len} m`];
 case'tank':return[`${p.cap/1000} mil L`,`nível ${p.lvl}%`];
 case'pump':return[`${p.cv} cv`,p.on?'ligada':'desligada'];
 case'elbow':return[`Joelho ${p.angle}°`,`DN ${p.dn} mm`];
 case'tee':return['Conexão T',`DN ${p.dn} mm`];
 case'valve':return[VT[p.vt][1],`DN ${p.dn} · ${p.open}%`];
 default:{const L=[],q=qh(n);if(p.kind!='q')L.push('P '+fmt(pm(n,p.unit))+' '+p.unit);if(p.kind!='p')L.push('Q '+fmt(q==null?null:Math.abs(q))+' m³/h');return L}}}
function edgeOf(n){const p=n.p,D=diam(n),A=Math.PI*D*D/4;
 if(n.type=='pump'){if(p.on&&p.h0>0&&p.qmax>0)return{pump:1,h0:p.h0,qm:p.qmax/3600};return{r:1e14,n:2}}
 if(n.type=='pipe')return{r:Math.max(10.643*Math.max(p.len,.1)/(Math.pow(Math.max(p.c,1),1.852)*Math.pow(D,4.87)),1e-2),n:1.852};
 let K=n.type=='meter'?(p.kind=='p'?.01:.2):p.k;
 if(n.type=='valve'){if(p.open<=0)return{r:1e14,n:2};if(p.open<100)K*=100/p.open}
 const e={r:Math.max(K/(2*G*A*A),1e-2),n:2};if(n.type=='valve'&&p.vt=='retencao')e.chk=1;return e}
/* vazão [m³/s] e condutância dQ/dΔ em função de Δ=Hi-Hj; regularizado perto de zero */
function phi(e,d){
 if(e.pump){const s=Math.sqrt(Math.max(1+d/e.h0,0));return[e.qm*s,e.qm/(2*e.h0*Math.max(s,.05))]}
 const r=e.chk&&d<0?e.r*1e6:e.r,a=Math.abs(d),dl=1e-3;
 if(a<dl){const g=Math.pow(dl/r,1/e.n)/dl;return[g*d,g]}
 const q=Math.pow(a/r,1/e.n);return[d<0?-q:q,q/(e.n*a)]}
function gauss(L,b){const n=b.length;for(let c=0;c<n;c++){let m=c;for(let r=c+1;r<n;r++)if(Math.abs(L[r][c])>Math.abs(L[m][c]))m=r;
 if(Math.abs(L[m][c])<1e-14)throw new Error('matriz singular');[L[c],L[m]]=[L[m],L[c]];[b[c],b[m]]=[b[m],b[c]];
 for(let r=c+1;r<n;r++){const f=L[r][c]/L[c][c];if(f){for(let k=c;k<n;k++)L[r][k]-=f*L[c][k];b[r]-=f*b[c]}}}
 for(let r=n-1;r>=0;r--){let s=b[r];for(let k=r+1;k<n;k++)s-=L[r][k]*b[k];b[r]=s/L[r][r]}return b}
function sim(){const R={ok:false,msg:'',H:{},Q:{},net:{},it:0,err:0};S.res=R;
 try{
 const par={},key=(i,p)=>i+':'+p,find=k=>{while(par[k]!=k){par[k]=par[par[k]];k=par[k]}return k},uni=(a,b)=>{par[find(a)]=find(b)};
 S.nodes.forEach(n=>ports(n).forEach((_,i)=>par[key(n.id,i)]=key(n.id,i)));
 S.links.forEach(l=>uni(key(l.a.id,l.a.p),key(l.b.id,l.b.p)));
 S.nodes.forEach(n=>{if(n.type=='tee'||n.type=='tank')for(let i=1;i<ports(n).length;i++)uni(key(n.id,0),key(n.id,i))});
 const idx={},nn=[],id=(n,i)=>{const r=find(key(n.id,i));if(!(r in idx)){idx[r]=nn.length;nn.push({fix:null,adj:[]})}return idx[r]};
 S.nodes.forEach(n=>ports(n).forEach((_,i)=>id(n,i)));
 const E=[];
 for(const n of S.nodes){
  if(n.type=='tank'){const k=id(n,0),h=n.p.z+n.p.h*n.p.lvl/100;if(nn[k].fix!==null&&Math.abs(nn[k].fix-h)>1e-6){R.msg='Reservatórios de níveis diferentes ligados diretamente: coloque cano, bomba ou registro entre eles.';return}nn[k].fix=h}
  else if(n.type!='tee'){const i=id(n,0),j=id(n,1);if(i!=j)E.push({c:n,i,j,...edgeOf(n)})}}
 E.forEach(e=>{nn[e.i].adj.push(e.j);nn[e.j].adj.push(e.i)});
 const reach=nn.map(v=>v.fix!==null),st=[];reach.forEach((r,k)=>{if(r)st.push(k)});
 if(!st.length){R.msg='Adicione ao menos um reservatório conectado à rede.';return}
 while(st.length){const k=st.pop();for(const m of nn[k].adj)if(!reach[m]){reach[m]=true;st.push(m)}}
 const top=Math.max(...nn.filter(v=>v.fix!==null).map(v=>v.fix));
 let H=nn.map(v=>v.fix!==null?v.fix:top);
 const U=[],pos={};nn.forEach((v,k)=>{if(reach[k]&&v.fix===null){pos[k]=U.length;U.push(k)}});
 const AE=E.filter(e=>reach[e.i]),norm=a=>a.reduce((m,x)=>Math.max(m,Math.abs(x)),0);
 const F=H=>{const f=new Array(U.length).fill(0);for(const e of AE){const Q=phi(e,H[e.i]-H[e.j])[0];if(pos[e.i]!==undefined)f[pos[e.i]]-=Q;if(pos[e.j]!==undefined)f[pos[e.j]]+=Q}return f};
 let f=F(H),nf=norm(f),it=0;
 while(nf>1e-8&&it<300&&U.length){it++;
  const L=U.map(()=>new Array(U.length).fill(0));
  for(const e of AE){const g=phi(e,H[e.i]-H[e.j])[1],a=pos[e.i],b=pos[e.j];if(a!==undefined)L[a][a]+=g;if(b!==undefined)L[b][b]+=g;if(a!==undefined&&b!==undefined){L[a][b]-=g;L[b][a]-=g}}
  const d=gauss(L,f.slice());let lam=1,H2,f2,n2;
  for(let t=0;t<12;t++){H2=H.slice();U.forEach((k,m)=>H2[k]+=lam*d[m]);f2=F(H2);n2=norm(f2);if(n2<nf||t==11)break;lam/=2}
  H=H2;f=f2;nf=n2}
 R.it=it;R.err=nf;
 if(nf>=1e-6){R.msg='O solver não convergiu (resíduo '+nf.toExponential(1)+' m³/s).';return}
 S.nodes.forEach(n=>{R.H[n.id]=ports(n).map((_,i)=>{const k=id(n,i);return reach[k]?H[k]:null})});
 for(const e of AE)R.Q[e.c.id]=phi(e,H[e.i]-H[e.j])[0];
 S.nodes.forEach(n=>{if(n.type=='tank'){const k=id(n,0);let s=0;for(const e of AE){const Q=R.Q[e.c.id];if(e.j==k)s+=Q;if(e.i==k)s-=Q}R.net[n.id]=s}});
 R.ok=true;
 }catch(err){R.ok=false;R.msg='Erro no solver: '+err.message}}
function resBox(n){const R=S.res,T='<h2>Simulação</h2>';
 if(!R.ok)return T+`<div class="warn">${R.msg}</div>`;
 const H=R.H[n.id];if(!H||H.every(x=>x==null))return T+'<div class="warn">Sem ligação com um reservatório: não simulado.</div>';
 const o=[],z=hz(n),Q=R.Q[n.id];let w='';
 H.forEach((h,i)=>{const m=h-z;o.push([`Pressão porta ${i+1}`,`${fmt(m)} mca · ${fmt(m*9.80665,1)} kPa`]);if(m<-.01)w+=`<div class="warn">⚠ Pressão negativa na porta ${i+1} (risco de cavitação).</div>`});
 if(Q!=null){const q=Math.abs(Q),v=q/(Math.PI*diam(n)**2/4);o.push(['Vazão',fmt(q*3600)+' m³/h ('+(Q>=0?'porta 1→2':'porta 2→1')+')']);
  if(n.type=='pump'){const hp=H[1]-H[0];o.push(['Altura manométrica',fmt(hp)+' m.c.a.'],['Potência absorvida',fmt(G*q*hp/(n.p.eff/100))+' kW'])}
  else{o.push(['Velocidade',fmt(v)+' m/s'],['Perda de carga',fmt(Math.abs(H[0]-H[1]),3)+' m.c.a.']);if(v>3)w+='<div class="warn">⚠ Velocidade acima de 3 m/s.</div>'}}
 if(n.type=='tank'){const net=R.net[n.id]*3600,vol=n.p.cap/1000,e=Math.abs(net)<.001;
  o.push(['Vazão líquida',fmt(net)+' m³/h ('+(e?'estável':net>0?'enchendo':'esvaziando')+')']);
  if(!e)o.push([net>0?'Tempo até encher':'Tempo até esvaziar',fmt(60*(net>0?vol*(1-n.p.lvl/100):vol*n.p.lvl/100)/Math.abs(net),0)+' min'])}
 return T+'<div class="box">'+o.map(x=>`<div class="kv"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')+'</div>'+w}
function simStatus(){const R=S.res;if(!R||!R.ok)return`<h2>Simulação</h2><div class="warn">${R&&R.msg||'Sem resultados.'}</div>`;
 const bal=Object.values(R.net).reduce((a,b)=>a+b,0)*3600;
 return`<h2>Simulação</h2><div class="box"><div class="kv"><span>Estado</span><span class="ok">✓ convergiu</span></div><div class="kv"><span>Iterações</span><span>${R.it}</span></div><div class="kv"><span>Resíduo máx.</span><span>${R.err.toExponential(1)} m³/s</span></div><div class="kv"><span>Σ vazão nos reservatórios</span><span>${fmt(bal,4)} m³/h</span></div></div><div class="pend">Regime permanente, recalculado a cada alteração. Portas livres são tratadas como fechadas.</div>`}
/* ---------- arquivo / exemplo ---------- */
function reset(){S.nodes=[];S.links=[];S.sel=null;S.pend=null;S.cnt={};S.id=1}
function example(){reset();
 const a=add('tank',{cap:10000,lvl:80},160,300),b=add('pump',{cv:3},320,300),c=add('pipe',{dn:50,len:30},480,300),d=add('valve',{dn:50,vt:'gaveta',k:.2},640,300),
 m=add('meter',{},800,300),e=add('pipe',{dn:50,len:20},960,300),f=add('tee',{},1120,300),g=add('tank',{cap:5000,lvl:20},1260,460);
 g.p.z=12;a.p.name='RES-01';m.p.name='M-01';
 [[a,1,b,0],[b,1,c,0],[c,1,d,0],[d,1,m,0],[m,1,e,0],[e,1,f,0]].forEach(([x,i,y,j])=>S.links.push({id:S.id++,a:{id:x.id,p:i},b:{id:y.id,p:j}}));
 S.links.push({id:S.id++,a:{id:f.id,p:2},b:{id:g.id,p:0}});
 draw();props()}
$('#bEx').onclick=example;
$('#bCl').onclick=()=>{reset();draw();props()};
$('#bSv').onclick=()=>{try{localStorage.setItem('hidr-v1',JSON.stringify(S));$('#hint').textContent='Rede salva neste navegador.'}catch(e){$('#hint').textContent='Não foi possível salvar.'}};
$('#bLd').onclick=()=>{try{const d=JSON.parse(localStorage.getItem('hidr-v1')||'null');if(!d)throw 0;Object.assign(S,d);S.sel=null;S.pend=null;draw();props()}catch(e){$('#hint').textContent='Nenhuma rede salva encontrada.'}};
buildPalette();example();
</script>
