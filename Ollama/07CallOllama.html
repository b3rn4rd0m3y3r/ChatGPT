<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1366, initial-scale=0.7">
<title>Ollama — projeto: chat completo com streaming</title>
<style>
:root{
    --azul:#3b82f6;
    --azul2:#2563eb;
    --roxo:#7c3aed;
    --card:#ffffff;
    --texto:#1e293b;
    --borda:#dbe4f0;
    --cinza:#64748b;
    --verde:#0d9488;
    --sidebar-bg:#f5f7fc;
    --sidebar-hover:#e8edf9;
    --sidebar-ativa:#e6ecff;
}

*{ box-sizing:border-box; }

html, body{ height:100%; }

body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:26px;
    background:linear-gradient(135deg,#dbeafe,#eef2ff,#ede9fe);
    font-family:"Trebuchet MS",Arial,sans-serif;
}

/* ---- moldura geral: menu lateral + painel de chat ---- */
.app-shell{
    width:100%;
    max-width:1024px;
    height:550px;
    background:var(--card);
    border-radius:18px;
    overflow:auto;
    box-shadow:0 20px 45px rgba(0,0,0,.15);
    display:flex;
}

/* ============ MENU LATERAL (retrátil) ============ */
.sidebar{
    width:272px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    border-right:1px solid var(--borda);
    overflow:hidden;
    transition:width .22s ease, border-color .22s ease;
}

/* colapsada: a largura vai a zero, o conteúdo interno mantém a largura
   fixa e simplesmente fica escondido pelo overflow:hidden do pai */
.sidebar.colapsada{
    width:0;
    border-right-color:transparent;
}

.sidebar-inner{
    width:272px;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:18px 14px;
}

.marca{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:bold;
    color:var(--texto);
    font-size:16px;
}

.marca svg{ flex-shrink:0; }

.legenda-aula{
    font-size:11.5px;
    color:var(--cinza);
    margin:2px 0 16px 32px;
}

.botao-nova{
    width:100%;
    padding:11px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,var(--azul),var(--roxo));
    color:white;
    font-family:"Trebuchet MS",Arial,sans-serif;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-bottom:16px;
}

.botao-nova:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 16px rgba(37,99,235,.3);
}

.lista-conversas{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:3px;
    margin:0 -6px;
    padding:0 6px;
}

.conversa-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    border-radius:9px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--texto);
    border-left:3px solid transparent;
    transition:background .15s;
}

.conversa-item:hover{ background:var(--sidebar-hover); }

.conversa-item.ativa{
    background:var(--sidebar-ativa);
    border-left-color:var(--azul);
    font-weight:bold;
}

.conversa-titulo{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.conversa-excluir{
    flex-shrink:0;
    border:none;
    background:none;
    color:var(--cinza);
    font-size:13px;
    width:22px;height:22px;
    border-radius:6px;
    cursor:pointer;
    opacity:0;
    transition:.15s;
}

.conversa-item:hover .conversa-excluir{ opacity:1; }
.conversa-excluir:hover{ background:#fee2e2; color:#dc2626; }

/* enquanto uma resposta está chegando, trocar de conversa fica bloqueado
   — evita misturar o streaming de uma conversa com a tela de outra */
.sidebar.bloqueada .lista-conversas,
.sidebar.bloqueada .botao-nova{
    pointer-events:none;
    opacity:.55;
}

/* ============ PAINEL DE CHAT ============ */
.chat-painel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.chat-topo{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 22px;
    background:linear-gradient(135deg,var(--azul),var(--roxo));
    color:white;
}

.botao-icone{
    flex-shrink:0;
    width:36px;height:36px;
    border-radius:9px;
    border:none;
    background:rgba(255,255,255,.16);
    color:white;
    font-size:17px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.botao-icone:hover{ background:rgba(255,255,255,.3); }

.chat-topo-titulo{ flex:1; min-width:0; }

.chat-topo-titulo h1{
    margin:0;
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-topo-titulo p{
    margin:2px 0 0;
    font-size:11.5px;
    opacity:.85;
}

.chat-topo select{
    width:auto;
    margin:0;
    padding:9px 10px;
    font-size:13px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.14);
    color:white;
    outline:none;
}

.chat-topo select option{ color:#111; }

/* ---- corpo: contador de depuracao + historico da conversa ---- */
.chat-corpo{
    flex:1;
    overflow-y:auto;
    padding:16px 24px 4px;
    background:#fbfcfe;
    display:flex;
    flex-direction:column;
}

#infoHistorico{
    font-size:12px;
    color:var(--cinza);
    text-align:right;
    margin:0 0 10px;
}

#historico{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:14px;
    padding-bottom:10px;
}

.msg{
    max-width:78%;
    padding:12px 16px;
    border-radius:14px;
    line-height:1.55;
    white-space:pre-wrap;
    position:relative;
}

.msg .papel{
    display:block;
    font-size:11px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:4px;
    opacity:.65;
}

.msg.user{
    align-self:flex-end;
    background:linear-gradient(135deg,var(--azul),var(--roxo));
    color:white;
    border-bottom-right-radius:4px;
}

.msg.user .papel{ color:rgba(255,255,255,.85); }

.msg.assistant{
    align-self:flex-start;
    background:#f8fafc;
    border:1px solid var(--borda);
    color:var(--texto);
    border-bottom-left-radius:4px;
}

.msg.assistant.erro{
    background:#fef2f2;
    border-color:#fca5a5;
    color:#b91c1c;
}

.msg.assistant.streaming::after{
    content:"";
    display:inline-block;
    width:8px; height:16px;
    margin-left:2px;
    background:var(--azul2);
    vertical-align:middle;
    animation:piscar 1s step-start infinite;
}

@keyframes piscar{ 50%{ opacity:0; } }

/* ---- rodape: composer + estatisticas ---- */
.chat-rodape{
    padding:16px 24px 20px;
    border-top:1px solid var(--borda);
    background:var(--card);
}

textarea{
    width:100%;
    padding:13px 14px;
    font-family:"Trebuchet MS",Arial,sans-serif;
    font-size:15px;
    border:1px solid var(--borda);
    border-radius:10px;
    outline:none;
    resize:vertical;
    min-height:64px;
    transition:.25s;
    margin-bottom:12px;
}

textarea:focus{
    border-color:var(--azul);
    box-shadow:0 0 0 4px rgba(59,130,246,.15);
}

button#enviar{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,var(--azul),var(--roxo));
    color:white;
    font-family:"Trebuchet MS",Arial,sans-serif;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

button#enviar:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 20px rgba(37,99,235,.35);
}

button#enviar:disabled{ opacity:.6; cursor:default; transform:none; }

button .spinner{
    width:16px; height:16px;
    border-radius:50%;
    border:2.5px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    display:none;
    animation:girar .7s linear infinite;
}

button.carregando .spinner{ display:inline-block; }

@keyframes girar{ to{ transform:rotate(360deg); } }

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:16px;
}

.stat{
    background:#f8fafc;
    border:1px solid var(--borda);
    border-radius:12px;
    padding:12px 10px;
    text-align:center;
    transition:.25s;
}

.stat.ativo{
    border-color:var(--azul);
    background:#eff6ff;
}

.stat svg{ display:block; margin:0 auto 6px; }

.stat .valor{
    font-size:20px;
    font-weight:bold;
    color:var(--texto);
    font-variant-numeric:tabular-nums;
}

.stat .rotulo{
    font-size:11px;
    color:var(--cinza);
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-top:2px;
}
</style>
</head>
<body>

<div class="app-shell">
    <!-- ============ MENU LATERAL ============ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-inner">

            <div class="marca">
				<svg width="30" height="34" viewBox="0 -10 80 100" fill="none" stroke="#2563eb"
					 stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
				  <!-- orelha esquerda -->
				  <path d="M27 16 C21 9 18 0 22 -4 C26 -7 31 -3 30 4 C29 9 28 13 27 16 Z"/>
				  <path d="M25 8 Q23 2 26 -3"/>
				  <!-- orelha direita -->
				  <path d="M53 16 C59 9 62 0 58 -4 C54 -7 49 -3 50 4 C51 9 52 13 53 16 Z"/>
				  <path d="M55 8 Q57 2 54 -3"/>
				  <!-- cabeça -->
				  <path d="M18 28 C18 14 28 6 40 6 C52 6 62 14 62 28 L62 62 C62 76 52 84 40 84 C28 84 18 76 18 62 Z"/>

				  <!-- olho esquerdo + cilios (acima do focinho, abaixo da orelha) -->
				  <ellipse cx="32" cy="28" rx="2.2" ry="2.8" fill="#2563eb" stroke="none"/>
				  <path d="M27 23 L24 20"/>
				  <path d="M29 21 L27 17"/>
				  <!-- olho direito + cilios -->
				  <ellipse cx="48" cy="28" rx="2.2" ry="2.8" fill="#2563eb" stroke="none"/>
				  <path d="M53 23 L56 20"/>
				  <path d="M51 21 L53 17"/>

				  <!-- mascara do focinho, abaixo dos olhos -->
				  <path d="M30 38 C26 38 25 46 25 52 C25 64 31 73 40 75 C49 73 55 64 55 52 C55 46 54 38 50 38 C46 34 34 34 30 38 Z"/>
				  <!-- narinas -->
				  <path d="M36 58 C34 54 30 55 30 59 C30 62 33 64 36 62 C37.5 61 37.5 59.5 36 58 Z"/>
				  <path d="M44 58 C46 54 50 55 50 59 C50 62 47 64 44 62 C42.5 61 42.5 59.5 44 58 Z"/>
				  <!-- sorriso -->
				  <path d="M32 68 Q36 72 40 69 Q44 72 48 68"/>
				</svg>
                <span>Ollama Chat</span>
            </div>
            <p class="legenda-aula">Aula 12 · projeto completo</p>

            <button id="novaConversa" class="botao-nova" type="button">
                <span>＋</span> Nova conversa
            </button>

            <div id="listaConversas" class="lista-conversas"></div>

        </div>
    </aside>

    <!-- ============ PAINEL DE CHAT ============ -->
    <div class="chat-painel">

        <header class="chat-topo">
            <button id="toggleSidebar" class="botao-icone" type="button" title="Mostrar/ocultar conversas">☰</button>
            <div class="chat-topo-titulo">
                <h1 id="tituloAtual">Nova conversa</h1>
                <p>/api/chat · streaming · histórico persistente</p>
            </div>
            <select id="modelo">
                <option value="llama3">llama3</option>
                <option value="mistral">mistral</option>
                <option value="phi3">phi3</option>
                <option value="qwen3:8b">qwen3:8b</option>
            </select>
        </header>

        <section class="chat-corpo">
            <div id="infoHistorico">Histórico: 0 mensagens na memória</div>
            <div id="historico"></div>
        </section>
        <footer class="chat-rodape">
            <textarea id="prompt" placeholder="Escreva sua mensagem... (Enter envia, Shift+Enter quebra linha)"></textarea>
            <button id="enviar" type="button">
                <span class="spinner"></span>
                <span class="rotulo-botao">Enviar</span>
            </button>
            <div class="stats">
                <div class="stat" id="cardTempo">
                    <!-- svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 7v5l3.5 2"/>
                    </svg -->
                    <div class="valor" id="statTempo">0.0s</div>
                    <div class="rotulo">Tempo</div>
                </div>
                <div class="stat" id="cardPalavras">
                    <!-- svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 6h16M4 12h16M4 18h10"/>
                    </svg -->
                    <div class="valor" id="statPalavras">0</div>
                    <div class="rotulo">Palavras</div>
                </div>
                <div class="stat" id="cardFragmentos">
                    <!-- svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="7" height="7" rx="1.5"/>
                        <rect x="13" y="4" width="7" height="7" rx="1.5"/>
                        <rect x="4" y="13" width="7" height="7" rx="1.5"/>
                        <rect x="13" y="13" width="7" height="7" rx="1.5"/>
                    </svg -->
                    <div class="valor" id="statFragmentos">0</div>
                    <div class="rotulo">Fragmentos</div>
                </div>
            </div>
        </footer>
    </div>
</div>

<script>
  /* =====================================================================
     ELEMENTOS
  ===================================================================== */
  const sidebar          = document.querySelector('#sidebar');
  const toggleSidebarBtn = document.querySelector('#toggleSidebar');
  const novaConversaBtn  = document.querySelector('#novaConversa');
  const listaConversas   = document.querySelector('#listaConversas');
  const tituloAtualEl    = document.querySelector('#tituloAtual');

  const modeloEl    = document.querySelector('#modelo');
  const promptEl    = document.querySelector('#prompt');
  const botao       = document.querySelector('#enviar');
  const rotuloBotao = botao.querySelector('.rotulo-botao');
  const historico    = document.querySelector('#historico');
  const infoHistorico = document.querySelector('#infoHistorico');

  const statTempo      = document.querySelector('#statTempo');
  const statPalavras   = document.querySelector('#statPalavras');
  const statFragmentos = document.querySelector('#statFragmentos');
  const cardTempo      = document.querySelector('#cardTempo');
  const cardPalavras   = document.querySelector('#cardPalavras');
  const cardFragmentos = document.querySelector('#cardFragmentos');

  const textoOriginalBotao = rotuloBotao.textContent;

  /* =====================================================================
     ESTADO: agora não existe mais UM histórico, e sim uma LISTA de
     conversas — cada uma com seu próprio array messages, seu próprio
     modelo escolhido e seu próprio título.
  ===================================================================== */
  const CHAVE_CONVERSAS = 'ollama_conversas_v1';
  const CHAVE_SIDEBAR   = 'ollama_sidebar_colapsada';

  const MENSAGEM_SISTEMA = { role: 'system', content: 'Responda sempre em português' };

  let conversas = [];       // [{ id, titulo, modelo, messages: [...] }, ...]
  let conversaAtualId = null;

  function gerarId() {
    return crypto.randomUUID ? crypto.randomUUID() : 'c' + Date.now() + Math.random().toString(36).slice(2, 8);
  }

  function obterConversaAtual() {
    return conversas.find(c => c.id === conversaAtualId);
  }

  // primeiras ~34 letras da primeira pergunta viram o "nome" da conversa,
  // do mesmo jeito que ChatGPT/Claude fazem
  function gerarTituloAutomatico(texto) {
    const limpo = texto.trim().replace(/\s+/g, ' ');
    return limpo.length > 34 ? limpo.slice(0, 34) + '…' : limpo;
  }

  /* ---- persistência: toda a lista de conversas cabe numa única chave ---- */
  function salvarEstado() {
    localStorage.setItem(CHAVE_CONVERSAS, JSON.stringify({ conversas, conversaAtualId }));
  }

  function carregarEstado() {
    const salvo = localStorage.getItem(CHAVE_CONVERSAS);
    return salvo ? JSON.parse(salvo) : null;
  }

  /* =====================================================================
     FUNÇÕES DE APOIO (iguais às aulas anteriores)
  ===================================================================== */
  function contarPalavras(texto) {
    const limpo = texto.trim();
    return limpo ? limpo.split(/\s+/).length : 0;
  }

  function formatarTempo(ms) {
    return (ms / 1000).toFixed(1) + 's';
  }

  function rolarParaFinal() {
    historico.scrollTop = historico.scrollHeight;
  }

  function criarBolha(role, textoInicial) {
    const bolha = document.createElement('div');
    bolha.className = 'msg ' + role;

    const rotuloPapel = document.createElement('span');
    rotuloPapel.className = 'papel';
    rotuloPapel.textContent = role === 'user' ? 'Você' : 'Assistente';

    const corpo = document.createElement('span');
    corpo.className = 'corpo';
    corpo.textContent = textoInicial || '';

    bolha.appendChild(rotuloPapel);
    bolha.appendChild(corpo);
    historico.appendChild(bolha);
    rolarParaFinal();
    return bolha;
  }

  function atualizarInfoHistorico(conversa) {
    const n = conversa.messages.length;
    infoHistorico.textContent = 'Histórico: ' + n + (n === 1 ? ' mensagem na memória' : ' mensagens na memória');
  }

  function redesenharConversa(conversa) {
    historico.innerHTML = '';
    conversa.messages
      .filter(m => m.role !== 'system')
      .forEach(m => criarBolha(m.role, m.content));
  }

  /* =====================================================================
     GERENCIAMENTO DE CONVERSAS (o que há de novo na aula 12)
  ===================================================================== */

  // desenha a barra lateral inteira a partir do array conversas
  function renderizarListaConversas() {
    listaConversas.innerHTML = '';

    conversas.forEach(c => {
      const item = document.createElement('div');
      item.className = 'conversa-item' + (c.id === conversaAtualId ? ' ativa' : '');
      item.dataset.id = c.id;

      const titulo = document.createElement('span');
      titulo.className = 'conversa-titulo';
      titulo.textContent = c.titulo;

      const excluir = document.createElement('button');
      excluir.className = 'conversa-excluir';
      excluir.type = 'button';
      excluir.title = 'Excluir conversa';
      excluir.textContent = '✕';

      item.appendChild(titulo);
      item.appendChild(excluir);
      listaConversas.appendChild(item);
    });
  }

  // troca a tela inteira (título, modelo, histórico, contadores) para a
  // conversa que está marcada como "atual"
  function abrirConversaAtual() {
    const conversa = obterConversaAtual();
    if (!conversa) return;

    tituloAtualEl.textContent = conversa.titulo;
    modeloEl.value = conversa.modelo || modeloEl.value;

    redesenharConversa(conversa);
    atualizarInfoHistorico(conversa);

    statTempo.textContent = '0.0s';
    statPalavras.textContent = '0';
    statFragmentos.textContent = '0';
    [cardTempo, cardPalavras, cardFragmentos].forEach(c => c.classList.remove('ativo'));
  }

  function criarConversa() {
    const nova = {
      id: gerarId(),
      titulo: 'Nova conversa',
      modelo: modeloEl.value,
      messages: [ { ...MENSAGEM_SISTEMA } ]
    };

    // entra no topo da lista — é a conversa mais recente
    conversas.unshift(nova);
    conversaAtualId = nova.id;

    salvarEstado();
    renderizarListaConversas();
    abrirConversaAtual();
    promptEl.focus();
  }

  function selecionarConversa(id) {
    if (id === conversaAtualId) return;
    conversaAtualId = id;
    salvarEstado();
    renderizarListaConversas();
    abrirConversaAtual();
  }

  function excluirConversa(id) {
    const indice = conversas.findIndex(c => c.id === id);
    if (indice === -1) return;

    const eraAConversaAberta = id === conversaAtualId;
    conversas.splice(indice, 1);

    // nunca fica sem nenhuma conversa: se apagou a última, cria outra vazia
    if (conversas.length === 0) {
      salvarEstado();
      criarConversa();
      return;
    }

    if (eraAConversaAberta) {
      conversaAtualId = conversas[0].id;
    }

    salvarEstado();
    renderizarListaConversas();
    if (eraAConversaAberta) abrirConversaAtual();
  }

  // um único listener na lista inteira decide, pelo elemento clicado, se é
  // pra trocar de conversa ou excluir uma — evita criar N listeners, um por item
  listaConversas.addEventListener('click', (evento) => {
    const item = evento.target.closest('.conversa-item');
    if (!item) return;
    const id = item.dataset.id;

    if (evento.target.closest('.conversa-excluir')) {
      if (confirm('Excluir esta conversa? Essa ação não pode ser desfeita.')) {
        excluirConversa(id);
      }
      return;
    }

    selecionarConversa(id);
  });

  novaConversaBtn.addEventListener('click', criarConversa);

  // cada conversa lembra o próprio modelo — trocar o select só afeta
  // a conversa que está aberta no momento
  modeloEl.addEventListener('change', () => {
    const conversa = obterConversaAtual();
    if (conversa) {
      conversa.modelo = modeloEl.value;
      salvarEstado();
    }
  });

  /* ---- menu lateral retrátil ---- */
  toggleSidebarBtn.addEventListener('click', () => {
    sidebar.classList.toggle('colapsada');
    localStorage.setItem(CHAVE_SIDEBAR, sidebar.classList.contains('colapsada') ? '1' : '0');
  });

  /* =====================================================================
     ENVIO DA MENSAGEM (mesma lógica de streaming das aulas 10 e 11,
     agora lendo e gravando dentro da conversa que está aberta)
  ===================================================================== */
  async function enviarMensagem() {
    const texto = promptEl.value.trim();
    if (!texto) return;

    const conversa = obterConversaAtual();
    if (!conversa) return;

    // primeira mensagem da conversa: gera o título automaticamente
    if (conversa.titulo === 'Nova conversa') {
      conversa.titulo = gerarTituloAutomatico(texto);
      tituloAtualEl.textContent = conversa.titulo;
      renderizarListaConversas();
    }

    criarBolha('user', texto);
    conversa.messages.push({ role: 'user', content: texto });
    atualizarInfoHistorico(conversa);
    promptEl.value = '';

    // --- reset visual dos indicadores ---
    botao.disabled = true;
    botao.classList.add('carregando');
    rotuloBotao.textContent = 'Perguntando...';
    sidebar.classList.add('bloqueada'); // evita trocar de conversa no meio do streaming
    statTempo.textContent = '0.0s';
    statPalavras.textContent = '0';
    statFragmentos.textContent = '0';
    [cardTempo, cardPalavras, cardFragmentos].forEach(c => c.classList.add('ativo'));

    const bolhaAssistente = criarBolha('assistant', '');
    bolhaAssistente.classList.add('streaming');
    const corpoAssistente = bolhaAssistente.querySelector('.corpo');

    let totalFragmentos = 0;
    let respostaCompleta = '';
    const inicio = performance.now();

    const cronometro = setInterval(() => {
      statTempo.textContent = formatarTempo(performance.now() - inicio);
    }, 100);

    try {
      const corpoRequisicao = {
        model: conversa.modelo || modeloEl.value,
        keep_alive: '5m',
        messages: conversa.messages,
        stream: true,
        options: {
          num_ctx: 4096,
          num_predict: -1,
          num_thread: navigator.hardwareConcurrency || 4,
          temperature: 0.4
        }
      };

      console.log('Enviando ao /api/chat:', JSON.parse(JSON.stringify(corpoRequisicao)));

      const r = await fetch('http://localhost:11434/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpoRequisicao)
      });

      if (!r.ok) {
        throw new Error('O Ollama respondeu com erro: ' + r.status);
      }

      const leitor = r.body.getReader();
      const decoder = new TextDecoder();
      let sobra = '';

      while (true) {
        const { value, done } = await leitor.read();
        if (done) break;

        sobra += decoder.decode(value, { stream: true });

        const linhas = sobra.split('\n');
        sobra = linhas.pop();

        for (const linha of linhas) {
          if (!linha.trim()) continue;
          const pedaco = JSON.parse(linha);

          totalFragmentos++;
          statFragmentos.textContent = totalFragmentos;

          if (pedaco.message && pedaco.message.content) {
            respostaCompleta += pedaco.message.content;
            corpoAssistente.textContent = respostaCompleta;
            statPalavras.textContent = contarPalavras(respostaCompleta);
            rolarParaFinal();
          }
        }
      }

      conversa.messages.push({ role: 'assistant', content: respostaCompleta });
      atualizarInfoHistorico(conversa);
      salvarEstado();

    } catch (erro) {
      bolhaAssistente.classList.add('erro');
      corpoAssistente.textContent =
        'Não consegui falar com o Ollama. Confira se ele está rodando ' +
        'em localhost:11434 e se o OLLAMA_ORIGINS está liberado (Aula 5).';
      console.error(erro);

      conversa.messages.pop();
      atualizarInfoHistorico(conversa);
    } finally {
      clearInterval(cronometro);
      statTempo.textContent = ((performance.now() - inicio) / 1000).toFixed(2) + 's';

      bolhaAssistente.classList.remove('streaming');
      botao.disabled = false;
      botao.classList.remove('carregando');
      rotuloBotao.textContent = textoOriginalBotao;
      sidebar.classList.remove('bloqueada');
      promptEl.focus();
    }
  }

  botao.addEventListener('click', enviarMensagem);

  promptEl.addEventListener('keydown', (evento) => {
    if (evento.key === 'Enter' && !evento.shiftKey) {
      evento.preventDefault();
      if (!botao.disabled) enviarMensagem();
    }
  });

  /* =====================================================================
     PONTO DE PARTIDA: recupera todas as conversas salvas (ou cria a
     primeira, se for o primeiro acesso) e abre a conversa mais recente
  ===================================================================== */
  (function iniciarApp() {
    const estadoSalvo = carregarEstado();

    if (estadoSalvo && Array.isArray(estadoSalvo.conversas) && estadoSalvo.conversas.length) {
      conversas = estadoSalvo.conversas;
      conversaAtualId = conversas.some(c => c.id === estadoSalvo.conversaAtualId)
        ? estadoSalvo.conversaAtualId
        : conversas[0].id;
    } else {
      conversas = [{
        id: gerarId(),
        titulo: 'Nova conversa',
        modelo: modeloEl.value,
        messages: [ { ...MENSAGEM_SISTEMA } ]
      }];
      conversaAtualId = conversas[0].id;
      salvarEstado();
    }

    if (localStorage.getItem(CHAVE_SIDEBAR) === '1') {
      sidebar.classList.add('colapsada');
    }

    renderizarListaConversas();
    abrirConversaAtual();
  })();
</script>
