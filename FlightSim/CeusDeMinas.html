  <body>
    <canvas id="world" aria-label="Vista tridimensional do aeródromo"></canvas>
    <canvas id="jet-preview" hidden aria-hidden="true"></canvas>
    <main id="menu">
      <header>
        <div class="brand"><span class="emblem">✦</span> CÉUS DE MINAS</div>
        <button id="manual" class="quiet">⌨ &nbsp; Comandos</button>
      </header>
      <section class="hero">
        <div class="hero-copy">
          <div class="eyebrow"><span></span> SIMULADOR DE VOO</div>
          <h1>Céus de<br /><em>Minas.</em></h1>
          <p>
            Assuma os comandos de um monomotor<br />sobre as serras de Minas
            Gerais.
          </p>
        </div>
        <div class="airtag">ASA ALTA &nbsp; / &nbsp; MONOMOTOR</div>
      </section>
      <section class="dispatch">
        <div class="strip">
          <b>AERÓDROMO SERRA CLARA</b><span>PISTA 09 / 27</span
          ><span>ELEVAÇÃO &nbsp; 2.600 FT</span>
        </div>
        <div class="setup">
          <div>
            <h2>Plano de voo</h2>
            <div class="modes" role="group" aria-label="Modo de voo">
              <button id="circuit" aria-pressed="true">
                <i>⌁</i
                ><span
                  ><strong>Primeiro circuito</strong
                  ><small>Voo guiado por etapas</small></span
                ><b class="radio"></b></button
              ><button id="free" aria-pressed="false">
                <i>✧</i
                ><span
                  ><strong>Voo livre</strong
                  ><small>Explore no seu ritmo</small></span
                ><b class="radio"></b>
              </button>
              <button id="jet" aria-pressed="false"><i>✈</i><span><strong>Jato de combate</strong><small>Missões arcade</small></span><b class="radio"></b></button>
            </div>
          </div>
          <div class="launch">
            <div id="arc-choice" hidden><label for="arc-mission">Missão do jato</label><select id="arc-mission"><option value="solo">Balizas terrestres</option><option value="duelo">Duelo de escudos</option><option value="mista">Circuito combinado</option></select></div>
            <label for="wind">Vento na pista 09</label
            ><select id="wind">
              <option value="0">Calmo · 0 kt</option>
              <option value="5.14444">De proa · 10 kt</option>
            </select>
            <div id="location" hidden>
              <label for="spawn">Ponto de partida</label
              ><select id="spawn">
                <option value="apron">Pátio do hangar</option>
                <option value="air">Em voo</option>
              </select>
            </div>
            <button class="primary" id="start">▶ &nbsp; Iniciar voo</button>
          </div>
        </div>
      </section>
    </main>
    <section id="flight" hidden>
      <div class="topbar">
        <b>✦ &nbsp; CÉUS DE MINAS</b><span id="flightmode"></span
        ><button id="cam">Câmera · C</button
        ><button id="pause">Pausa · P</button
        ><button id="help">Ajuda · H</button>
      </div>
      <div id="guidance">
        <span id="leg"></span><strong id="instruction"></strong>
      </div>
      <span id="warning" hidden>AVISO DE ESTOL</span>
      <div class="cowling" aria-hidden="true"></div>
      <div id="panel">
        <div class="attitude">
          <div id="sphere"></div>
          <div class="level"></div>
        </div>
        <div id="gauges"></div>
      </div>
    </section>
    <section id="arc" hidden aria-label="Arena do jato">
      <canvas id="arc-canvas" tabindex="-1" aria-label="Voo do jato na arena"></canvas>
      <div class="topbar"><b>✦ &nbsp; JATO SERRA</b><span id="arc-name"></span><button id="arc-camera">Câmera · Cauda (X)</button><button id="arc-help">Ajuda · H</button><button id="arc-pause">Pausa · P</button></div>
      <div class="arc-hud"><small id="arc-status"></small><strong id="arc-objective"></strong></div>
      <div class="arc-actions"><span id="arc-lens"></span><button id="arc-bomb">B · Bomba de luz</button><button id="arc-pulse">M · Míssil de pulso</button></div>
      <div id="arc-overlay" hidden><div role="dialog" aria-modal="true" aria-labelledby="arc-title"><h2 id="arc-title"></h2><p id="arc-message"></p><label id="arc-volume">Volume <input id="arc-level" type="range" min="0" max="100" value="35"></label><button id="arc-resume" class="primary">Retomar</button> <button id="arc-restart">Reiniciar missão</button> <button id="arc-exit">Voltar ao menu</button></div></div>
    </section>
    <dialog id="modal">
      <div id="dialogBody"></div>
      <div id="dialogActions"></div>
    </dialog>
  </body>
</html>
