<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de Textos Web</title>
<style>
:root{color-scheme:light dark;--bg:#eef1f5;--panel:#fff;--paper:#fff;--ink:#202633;--muted:#657083;--line:#d6dce5;--accent:#356ac3;--accent-soft:#e5efff;--cell:#f4f7fb;--shadow:0 5px 24px #17243a18}
@media(prefers-color-scheme:dark){:root{--bg:#171b22;--panel:#222832;--paper:#272d37;--ink:#edf1f7;--muted:#aab4c4;--line:#414b5b;--accent:#8ab4ff;--accent-soft:#293d5b;--cell:#303845;--shadow:0 5px 24px #0005}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:14px max(14px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
.topline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:750;font-size:1.05rem;margin-right:4px}.title{flex:1;min-width:170px;max-width:440px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--paper);color:var(--ink);font:inherit}
.toolbar{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:9px}.toolbar button,.toolbar select,.toolbar input[type=color],.toolbar input[type=number],.toolbar label{border:1px solid var(--line);border-radius:7px;min-height:35px;background:var(--panel);color:var(--ink);padding:6px 9px;font:inherit}.toolbar button{cursor:pointer}.toolbar button:hover{background:var(--accent-soft)}.toolbar button:disabled{opacity:.38;cursor:not-allowed}.toolbar button.active{outline:2px solid var(--accent)}.toolbar .danger{background:#b9343e;color:#fff;border-color:#b9343e}.toolbar .primary{background:var(--accent);color:white;border-color:var(--accent)}.toolbar select{max-width:190px}.toolbar input[type=color]{width:40px;padding:3px}.toolbar .textmark{font-weight:800;min-width:35px}.subbar{padding-top:7px;border-top:1px solid var(--line);margin-top:9px}.subbar[hidden]{display:none}.hint{color:var(--muted);font-size:.82rem;margin-left:auto}
main{padding:24px 14px 54px;min-height:65vh}.paper{width:min(100%,820px);min-height:850px;margin:0 auto;background:var(--paper);color:var(--ink);padding:clamp(22px,5vw,76px);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:3px;overflow-wrap:anywhere;outline:none;line-height:1.65}
.paper:empty:before{content:"Comece a escrever…";color:var(--muted);pointer-events:none}.paper h1{font-size:2em}.paper h2{font-size:1.6em}.paper h3{font-size:1.35em}.paper blockquote{border-left:4px solid var(--accent);margin:1em 0;padding:.4em 1em;background:var(--cell)}.paper pre{white-space:pre-wrap;background:var(--cell);padding:12px;border-radius:6px;font-family:ui-monospace,monospace}.paper table{border-collapse:collapse;width:100%;margin:1em 0;table-layout:auto}.paper td,.paper th{border:1px solid var(--line);padding:7px;min-width:45px;vertical-align:top}.paper th{background:var(--cell);font-weight:700}.paper img{max-width:100%;height:auto;vertical-align:middle;resize:both}.paper td:focus,.paper th:focus{outline:2px solid var(--accent)}
#source{display:none;width:min(100%,1000px);min-height:75vh;margin:0 auto;padding:18px;background:var(--paper);color:var(--ink);border:1px solid var(--line);font:13px/1.5 ui-monospace,monospace;white-space:pre;overflow:auto;tab-size:2}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:7px max(14px,env(safe-area-inset-left));display:flex;gap:16px;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:.84rem;z-index:4}
#notice{position:fixed;bottom:48px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);z-index:10;display:none;max-width:90vw}
@media(max-width:600px){header{position:relative}.brand{width:100%}.toolbar{gap:4px}.toolbar button,.toolbar select{font-size:.88rem;padding:5px 7px}.paper{min-height:65vh;padding:22px 18px}main{padding:12px 8px 65px}.hint{width:100%;margin-left:0}}
</style>
</head>
<body>
<header>
 <div class="topline"><span class="brand">✍️ Editor de Textos Web</span><input class="title" id="docTitle" aria-label="Título do documento" value="Documento sem título"><span class="hint">Salvamento automático local</span></div>
 <div class="toolbar" id="mainbar">
  <button id="newBtn" class="danger" title="Novo documento">📄 Novo</button>
  <button id="openBtn" title="Abrir HTML, TXT ou JSON">📂 Abrir</button><input id="openFile" type="file" accept=".html,.htm,.txt,.json,text/html,text/plain,application/json" hidden>
  <select id="blockType" aria-label="Estilo do parágrafo" title="Estilo do parágrafo"><option value="p">Parágrafo</option><option value="h1">H1 — Título 1</option><option value="h2">H2 — Título 2</option><option value="h3">H3 — Título 3</option><option value="h4">H4 — Título 4</option><option value="h5">H5 — Título 5</option><option value="h6">H6 — Título 6</option><option value="blockquote">Citação</option><option value="pre">Código</option></select>
  <button class="textmark" data-cmd="bold" title="Negrito">N</button><button class="textmark" data-cmd="italic" title="Itálico"><i>I</i></button><button class="textmark" data-cmd="underline" title="Sublinhado"><u>S</u></button><button class="textmark" data-cmd="strikeThrough" title="Tachado"><s>T</s></button><button class="textmark" data-cmd="subscript" title="Subscrito">x₂</button><button class="textmark" data-cmd="superscript" title="Sobrescrito">x²</button>
  <select id="fontName" title="Família da fonte"><option value="">Fonte</option><option>Arial</option><option>Calibri</option><option>Georgia</option><option>Tahoma</option><option>Times New Roman</option><option>Verdana</option><option>Courier New</option></select>
  <select id="fontSize" title="Tamanho em pixels"><option value="">Tamanho</option><option>10</option><option>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>32</option><option>36</option><option>48</option><option>64</option></select>
  <label title="Cor do texto">🎨 <input id="textColor" type="color" aria-label="Cor do texto" value="#202633"></label><label title="Cor de destaque">🖍️ <input id="highlightColor" type="color" aria-label="Cor de destaque" value="#fff176"></label>
  <button data-cmd="justifyLeft" title="Alinhar à esquerda">⬅️</button><button data-cmd="justifyCenter" title="Centralizar">↔️</button><button data-cmd="justifyRight" title="Alinhar à direita">➡️</button><button data-cmd="justifyFull" title="Justificar">📰</button>
  <button data-cmd="insertUnorderedList" title="Lista com marcadores">📋</button><button data-cmd="insertOrderedList" title="Lista numerada">🔢</button>
  <button id="tableToggle" title="Ferramentas de tabela">🗓️ Tabela</button><button id="imageBtn" title="Inserir imagem">🖼️ Imagem</button><input id="imageFile" type="file" accept="image/*" hidden>
  <button data-cmd="removeFormat" title="Limpar formatação">🧹 Limpar</button><button data-cmd="undo" title="Desfazer">↩️</button><button data-cmd="redo" title="Refazer">↪️</button>
  <button id="sourceBtn" title="Ver e editar HTML">🌐 Ver HTML</button><button id="docxCheckBtn" title="Verificar a estrutura e a compatibilidade da exportação DOCX">🔎 Verificar DOCX</button><button id="saveBtn" class="primary" title="Salvar como">💾 Salvar como</button>
  <select id="saveType" aria-label="Formato de salvamento"><option value="txt">📝 TXT</option><option value="html">🌐 HTML</option><option value="json">🧾 JSON</option><option value="docx">📘 Word (DOCX)</option></select>
 </div>
 <div id="tablebar" class="toolbar subbar" hidden>
  <strong>Ferramentas de tabela</strong><button id="insertTable">➕ Inserir</button><button data-table="row-above">⬆️ Linha acima</button><button data-table="row-below">⬇️ Linha abaixo</button><button data-table="col-left">⬅️ Coluna à esquerda</button><button data-table="col-right">➡️ Coluna à direita</button><button data-table="delete-row">❌ Excluir linha</button><button data-table="delete-col">❌ Excluir coluna</button><button data-table="delete-table">🗑️ Excluir tabela</button><button data-table="header">🏷️ Cabeçalho</button><label>🎨 Fundo <input id="cellColor" type="color" value="#fff2cc" aria-label="Fundo da célula"></label>
  <span class="hint">Tab avança; Tab na última célula cria uma linha.</span>
 </div>
</header>
<main><article id="editor" class="paper" contenteditable="true" spellcheck="true" aria-label="Documento editável"><p><br></p></article><textarea id="source" aria-label="Código-fonte HTML" spellcheck="false"></textarea></main>
<footer><span id="wordCount">0 palavras</span><span id="charCount">0 caracteres</span><span id="imageCount">0 imagens</span><span id="saveState">Pronto</span></footer><div id="notice" role="status"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), editor=$('editor'), source=$('source'), title=$('docTitle');
let savedRange=null,newArmed=false,newTimer=0,noticeTimer=0,sourceMode=false;
const STORAGE='editorTextosWeb.autosave.v1';
try{document.execCommand('styleWithCSS',false,true);document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
function notify(msg){const n=$('notice');n.textContent=msg;n.style.display='block';clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.style.display='none',2600)}
function inEditor(node){return node && (node===editor||editor.contains(node))}
function saveRange(){const s=getSelection();if(s&&s.rangeCount){const r=s.getRangeAt(0);if(inEditor(r.startContainer)&&inEditor(r.endContainer))savedRange=r.cloneRange()}}
function restoreRange(){if(!savedRange)return;try{const s=getSelection();s.removeAllRanges();s.addRange(savedRange)}catch(e){}}
function focusEditor(){editor.focus({preventScroll:true});restoreRange()}
function exec(cmd,val=null){focusEditor();try{document.execCommand(cmd,false,val)}catch(e){}saveRange();sync();updateBlock()}
document.querySelectorAll('[data-cmd]').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>exec(b.dataset.cmd))});
editor.addEventListener('mouseup',()=>{saveRange();updateBlock();updateTablebar()});editor.addEventListener('keyup',()=>{saveRange();updateBlock();updateTablebar()});editor.addEventListener('input',()=>{saveRange();sync();updateTablebar()});
document.addEventListener('selectionchange',()=>{saveRange();if(inEditor(document.getSelection()?.anchorNode))updateBlock()});
function closestBlock(node){if(!node)return null;let el=node.nodeType===1?node:node.parentElement;while(el&&el!==editor){if(/^(P|H[1-6]|BLOCKQUOTE|PRE|LI|TD|TH|DIV)$/.test(el.tagName))return el;el=el.parentElement}return null}
function updateBlock(){const b=closestBlock(getSelection()?.anchorNode);let v='p';if(b){v=b.tagName.toLowerCase();if(v==='li'||v==='td'||v==='th'||v==='div')v='p';if(!['p','h1','h2','h3','h4','h5','h6','blockquote','pre'].includes(v))v='p'}$('blockType').value=v}
$('blockType').addEventListener('mousedown',e=>{saveRange()});$('blockType').addEventListener('change',e=>{focusEditor();const v=e.target.value;exec('formatBlock',v==='blockquote'?'blockquote':v==='pre'?'pre':v)});
function applyColor(cmd,color){focusEditor();exec(cmd,color)}
$('textColor').addEventListener('mousedown',saveRange);$('textColor').addEventListener('input',e=>applyColor('foreColor',e.target.value));
$('highlightColor').addEventListener('mousedown',saveRange);$('highlightColor').addEventListener('input',e=>{focusEditor();try{document.execCommand('hiliteColor',false,e.target.value)}catch(_){document.execCommand('backColor',false,e.target.value)}saveRange();sync()});
$('fontName').addEventListener('mousedown',saveRange);$('fontName').addEventListener('change',e=>{if(e.target.value)exec('fontName',e.target.value);e.target.value=''});
$('fontSize').addEventListener('mousedown',saveRange);$('fontSize').addEventListener('change',e=>{const px=Number(e.target.value);if(!px)return;focusEditor();document.execCommand('fontSize',false,'7');editor.querySelectorAll('font[size="7"]').forEach(f=>{const span=document.createElement('span');span.style.fontSize=px+'px';while(f.firstChild)span.appendChild(f.firstChild);f.replaceWith(span)});e.target.value='';saveRange();sync()});
function updateTablebar(){const c=cellAtSelection();document.querySelectorAll('[data-table]').forEach(b=>b.disabled=!c)}
function cellAtSelection(){const n=getSelection()?.anchorNode;const el=n?.nodeType===1?n:n?.parentElement;const c=el?.closest?.('td,th');return c&&editor.contains(c)?c:null}
$('tableToggle').addEventListener('mousedown',e=>e.preventDefault());$('tableToggle').addEventListener('click',()=>{$('tablebar').hidden=!$('tablebar').hidden;if(!$('tablebar').hidden)updateTablebar()});
$('insertTable').addEventListener('mousedown',e=>e.preventDefault());$('insertTable').addEventListener('click',()=>{
 const rows=promptSafe('Número de linhas (1–50):','3');if(rows===null)return;
 const cols=promptSafe('Número de colunas (1–20):','3');if(cols===null)return;
 const head=confirmSafeHeader(),table=document.createElement('table'),tbody=document.createElement('tbody');
 table.appendChild(tbody);
 for(let r=0;r<rows;r++){const tr=document.createElement('tr');for(let c=0;c<cols;c++){const cell=document.createElement(head&&r===0?'th':'td');cell.innerHTML='<p><br></p>';tr.appendChild(cell)}tbody.appendChild(tr)}
 const spacer=document.createElement('p');spacer.innerHTML='<br>';
 focusEditor();let top=null;
 if(savedRange&&inEditor(savedRange.startContainer)){top=savedRange.startContainer.nodeType===1?savedRange.startContainer:savedRange.startContainer.parentElement;while(top&&top.parentElement!==editor)top=top.parentElement}
 const range=document.createRange();if(top&&top.parentElement===editor){range.setStartAfter(top);range.collapse(true)}else{range.selectNodeContents(editor);range.collapse(false)}
 range.insertNode(table);table.after(spacer);
 const first=table.querySelector('td,th');if(first){const target=first.querySelector('p')||first;const caret=document.createRange();caret.selectNodeContents(target);caret.collapse(true);const sel=getSelection();sel.removeAllRanges();sel.addRange(caret);savedRange=caret.cloneRange()}
 editor.focus({preventScroll:true});sync();updateTablebar();notify('Tabela inserida. Clique em uma célula para editar.');
});
function promptSafe(label,def){const x=window.prompt(label,def);if(x===null)return null;const n=Number(String(x).trim());if(!Number.isInteger(n)||n<1||n>(label.includes('linhas')?50:20)){notify('Informe um número inteiro dentro do limite indicado.');return null}return n}
function confirmSafeHeader(){return window.confirm('A primeira linha deve ser cabeçalho (células th)?')}
document.querySelectorAll('[data-table]').forEach(b=>{b.addEventListener('mousedown',e=>e.preventDefault());b.addEventListener('click',()=>tableAction(b.dataset.table))});
function tableAction(action){const cell=cellAtSelection();if(!cell)return;const row=cell.parentElement,table=cell.closest('table'),idx=Array.from(row.cells).indexOf(cell);if(action==='delete-table'){table.remove();sync();updateTablebar();return}
if(action==='row-above'||action==='row-below'){const nr=table.insertRow(Array.from(row.parentElement.rows).indexOf(row)+(action==='row-below'?1:0));for(let i=0;i<row.cells.length;i++){const c=nr.insertCell();c.innerHTML='<p><br></p>'}nr.cells[Math.min(idx,nr.cells.length-1)]?.focus()}
if(action==='col-left'||action==='col-right'){const pos=idx+(action==='col-right'?1:0);Array.from(table.rows).forEach((r,ri)=>{const c=document.createElement(ri===0&&Array.from(r.cells).some(x=>x.tagName==='TH')?'th':'td');c.innerHTML='<p><br></p>';r.insertBefore(c,r.cells[pos]||null)});table.rows[Math.min(Array.from(table.rows).indexOf(row),table.rows.length-1)].cells[pos]?.focus()}
if(action==='delete-row'){if(table.rows.length>1)row.remove();else table.remove()}
if(action==='delete-col'){if(row.cells.length>1)Array.from(table.rows).forEach(r=>r.cells[idx]?.remove());else table.remove()}
if(action==='header'){const first=table.rows[0];if(first){Array.from(first.cells).forEach(c=>{const n=document.createElement(c.tagName==='TH'?'td':'th');n.innerHTML=c.innerHTML;n.style.cssText=c.style.cssText;c.replaceWith(n)})}}
saveRange();sync();updateTablebar()}
$('cellColor').addEventListener('mousedown',saveRange);$('cellColor').addEventListener('input',e=>{const c=cellAtSelection();if(c)c.style.backgroundColor=e.target.value;sync()});
editor.addEventListener('keydown',e=>{if(e.key==='Tab'){const c=cellAtSelection();if(!c)return;e.preventDefault();const t=c.closest('table'),cells=Array.from(t.querySelectorAll('td,th')),i=cells.indexOf(c);let next=cells[i+(e.shiftKey?-1:1)];if(!next&&!e.shiftKey){const row=t.insertRow();for(let j=0;j<t.rows[t.rows.length-2].cells.length;j++){const td=row.insertCell();td.innerHTML='<p><br></p>'}next=row.cells[0]}if(next){next.focus();const r=document.createRange();r.selectNodeContents(next);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);saveRange();updateTablebar()}}});
$('imageBtn').addEventListener('mousedown',e=>e.preventDefault());$('imageBtn').addEventListener('click',()=>{$('imageFile').click()});
$('imageFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(f)await insertImageFile(f);e.target.value=''});
async function insertImageFile(file){if(!file.type.startsWith('image/')){notify('Escolha um arquivo de imagem.');return}const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});focusEditor();document.execCommand('insertHTML',false,`<img src="${data}" alt="${escapeAttr(file.name)}" style="max-width:100%;height:auto">`);saveRange();sync()}
function escapeAttr(s){return String(s).replace(/[&"<]/g,c=>({'&':'&amp;','"':'&quot;','<':'&lt;'}[c]))}
editor.addEventListener('paste',async e=>{const files=Array.from(e.clipboardData?.items||[]).filter(i=>i.type.startsWith('image/'));if(files.length){e.preventDefault();for(const item of files){const f=item.getAsFile();if(f)await insertImageFile(f)}}});
editor.addEventListener('dragover',e=>{if(Array.from(e.dataTransfer?.files||[]).some(f=>f.type.startsWith('image/')))e.preventDefault()});
editor.addEventListener('drop',async e=>{const files=Array.from(e.dataTransfer?.files||[]).filter(f=>f.type.startsWith('image/'));if(files.length){e.preventDefault();for(const f of files)await insertImageFile(f)}});
$('newBtn').addEventListener('click',()=>{if(!newArmed){newArmed=true;$('newBtn').textContent='⚠️ Apagar tudo? Clique de novo';clearTimeout(newTimer);newTimer=setTimeout(resetNewButton,3500);return}clearTimeout(newTimer);newArmed=false;editor.innerHTML='<p><br></p>';source.value='';title.value='Documento sem título';sourceMode=false;source.style.display='none';editor.style.display='';$('sourceBtn').textContent='🌐 Ver HTML';try{localStorage.removeItem(STORAGE)}catch(e){}savedRange=null;sync();resetNewButton();notify('Novo documento criado.')});
function resetNewButton(){$('newBtn').textContent='📄 Novo';newArmed=false}
$('sourceBtn').addEventListener('mousedown',e=>e.preventDefault());$('sourceBtn').addEventListener('click',()=>{if(!sourceMode){source.value=editor.innerHTML;editor.style.display='none';source.style.display='block';sourceMode=true;$('sourceBtn').textContent='✍️ Voltar à edição'}else{editor.innerHTML=source.value;source.style.display='none';editor.style.display='';sourceMode=false;$('sourceBtn').textContent='🌐 Ver HTML';sync();notify('HTML aplicado ao documento.')}});
$('openBtn').addEventListener('click',()=>$('openFile').click());$('openFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{const txt=await f.text(),ext=f.name.split('.').pop().toLowerCase();if(ext==='json'){const j=JSON.parse(txt);editor.innerHTML=j.html||escapeHtml(j.text||'');title.value=j.title||f.name}else if(ext==='txt'){editor.innerHTML=txt.split(/\r?\n/).map(x=>'<p>'+escapeHtml(x||'')+'</p>').join('');title.value=f.name.replace(/\.[^.]+$/,'')}else{const d=new DOMParser().parseFromString(txt,'text/html');editor.innerHTML=d.body.innerHTML;title.value=d.querySelector('title')?.textContent||f.name.replace(/\.[^.]+$/,'')}sourceMode=false;source.style.display='none';editor.style.display='';$('sourceBtn').textContent='🌐 Ver HTML';sync();notify('Documento aberto.')}catch(err){notify('Não foi possível abrir esse arquivo.')}e.target.value=''});
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function cleanHTML(){const clone=editor.cloneNode(true);clone.querySelectorAll('script,iframe,object,embed').forEach(n=>n.remove());return clone.innerHTML}
function plainText(){return editor.innerText||editor.textContent||''}
function blocks(){return Array.from(editor.children).map(el=>({tag:el.tagName.toLowerCase(),text:el.innerText||el.textContent||'',html:el.outerHTML}))}
function sync(){const text=plainText().trim();const words=text?text.split(/\s+/).length:0;$('wordCount').textContent=words+' palavras';$('charCount').textContent=(editor.innerText||editor.textContent||'').length+' caracteres';$('imageCount').textContent=editor.querySelectorAll('img').length+' imagens';$('saveState').textContent='Alterações locais';try{localStorage.setItem(STORAGE,JSON.stringify({title:title.value,html:cleanHTML(),savedAt:new Date().toISOString()}))}catch(e){$('saveState').textContent='Armazenamento indisponível'}}
title.addEventListener('input',sync);
function fullHTML(){return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>'+escapeHtml(title.value)+'</title><style>body{max-width:820px;margin:40px auto;padding:24px;font:16px/1.6 Arial,sans-serif;color:#222}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:7px;vertical-align:top}th{background:#eee}blockquote{border-left:4px solid #888;padding-left:1em}pre{white-space:pre-wrap;background:#f5f5f5;padding:12px}img{max-width:100%;height:auto}</style></head><body>'+cleanHTML()+'</body></html>'}
$('saveBtn').addEventListener('mousedown',e=>e.preventDefault());
$('saveBtn').addEventListener('click',async()=>{
 const type=$('saveType').value;
 try{
  if(type==='txt') await download(plainText(),safeName()+'.txt','text/plain;charset=utf-8');
  else if(type==='html') await download(fullHTML(),safeName()+'.html','text/html;charset=utf-8');
  else if(type==='json'){
   const data={version:1,title:title.value,date:new Date().toISOString(),html:cleanHTML(),text:plainText(),blocks:blocks()};
   await download(JSON.stringify(data,null,2),safeName()+'.json','application/json;charset=utf-8');
  }else if(type==='docx'){
   await exportDocx();
  }else{
   throw new Error('Formato de arquivo não reconhecido: '+type);
  }
 }catch(e){
  console.error('[Editor de Textos Web] Erro ao salvar arquivo:',e);
  const detail=e&&e.message?e.message:String(e);
  notify('Não foi possível salvar: '+detail);
 }
});
function safeName(){return(title.value.trim()||'Documento sem título').replace(/[\\/:*?"<>|]+/g,'_').slice(0,120)}
async function download(data,name,mime){
 const blob=data instanceof Blob?data:new Blob([data],{type:mime});

  throw new Error('O navegador impediu o início do download: '+(e.message||e));

.openxmlformats.org/officeDocument/2006/relationships/numbering',Target:'numbering.xml'}];docxMedia.forEach(m=>rels.push({Id:m.rId,Type:'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image',Target:'media/'+m.name}));const relXml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels.map(r=>'<Relationship Id="'+r.Id+'" Type="'+r.Type+'" Target="'+r.Target+'"/>').join('')+'</Relationships>';validateXmlPart(documentXml,'document.xml');validateXmlPart(styles,'styles.xml');validateXmlPart(numbering,'numbering.xml');validateXmlPart(relXml,'document.xml.rels');validateXmlPart('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+types,'[Content_Types].xml');const files=[{name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+types},{name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},{name:'word/document.xml',data:documentXml},{name:'word/styles.xml',data:styles},{name:'word/numbering.xml',data:numbering},{name:'word/_rels/document.xml.rels',data:relXml},...docxMedia.map(m=>({name:'word/media/'+m.name,data:m.data}))];const packageBlob=await zipStore(files);await validateZipBlob(packageBlob,files);download(packageBlob,safeName()+'.docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document')}
